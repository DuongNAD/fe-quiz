<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FE Quiz · CSD201 · IOT102 · JPD123</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@500;600;700&family=JetBrains+Mono:wght@600&display=swap">
<style>
:root {
  --bg: #F8FAFC;
  --surface: #FFFFFF;
  --surface-2: #F1F5F9;
  --ink: #0F172A;
  --muted: #64748B;
  --line: #E2E8F0;
  --csd: #2563EB;
  --iot: #0D9488;
  --jpd: #7C3AED;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0B1120;
    --surface: #111827;
    --surface-2: #1E293B;
    --ink: #F1F5F9;
    --muted: #94A3B8;
    --line: #273449;
    --csd: #60A5FA;
    --iot: #2DD4BF;
    --jpd: #A78BFA;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: "Be Vietnam Pro", "Segoe UI", system-ui, sans-serif;
  font-size: 14.5px;
  padding: 16px 12px 28px;
}
.wrap { max-width: 580px; margin-inline: auto; display: grid; gap: 10px; }
h1 { margin: 0 0 2px; font-size: 20px; font-weight: 700; letter-spacing: -.01em; }
.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 12px 14px;
  display: grid;
  gap: 8px;
}
.top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px; }
.title-row { display: flex; align-items: center; gap: 8px; }
.pill {
  font-family: "JetBrains Mono", Consolas, ui-monospace, monospace;
  font-size: 11.5px;
  font-weight: 600;
  padding: 2px 7px;
  border-radius: 6px;
  background: var(--surface-2);
  border: 1px solid var(--line);
}
.pill.csd { color: var(--csd); }
.pill.iot { color: var(--iot); }
.pill.jpd { color: var(--jpd); }
.title { margin: 0; font-size: 16.5px; font-weight: 700; }
.badge { font-size: 12px; color: var(--muted); font-weight: 600; }
.actions { display: flex; gap: 8px; }
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 40px;
  padding: 8px 14px;
  border-radius: 9px;
  font-weight: 600;
  font-size: 14px;
  text-decoration: none;
  border: 1px solid var(--line);
  background: var(--surface-2);
  color: var(--ink);
  white-space: nowrap;
}
.btn.primary { flex: 1 1 auto; color: #FFFFFF; border-color: transparent; }
.btn.csd { background: var(--csd); }
.btn.iot { background: var(--iot); }
.btn.jpd { background: var(--jpd); }
@media (prefers-color-scheme: dark) {
  .btn.primary { color: #0B1120; }
}
@media (max-width: 480px) {
  body { padding: 12px 8px 20px; }
  .card { padding: 11px 12px; }
  .btn { min-height: 38px; padding: 7px 10px; font-size: 13.5px; }
}
</style>
</head>
<body>
<main class="wrap">
  <h1>FE Quiz</h1>

  <article class="card">
    <div class="top">
      <div class="title-row">
        <span class="pill csd">CSD201</span>
        <h2 class="title">CSD201 FE</h2>
      </div>
      <span class="badge">🔥 51 câu tủ Retake · 274 câu (9 đề + FA26-FE)</span>
    </div>
    <div class="actions">
      <a class="btn primary csd" href="./CSD201_FE_QUIZ.html">Vào làm CSD201 →</a>
      <a class="btn" href="./TU_CAP_TOC_CSD201.txt">Tủ Retake .txt</a>
    </div>
  </article>

  <article class="card">
    <div class="top">
      <div class="title-row">
        <span class="pill iot">IOT102</span>
        <h2 class="title">IOT102 FE</h2>
      </div>
      <span class="badge">🔥 100 / 245 câu · A–D cố định</span>
    </div>
    <div class="actions">
      <a class="btn primary iot" href="./IOT102_FE_QUIZ.html">Vào làm IOT102 →</a>
      <a class="btn" href="./TU_CAP_TOC_IOT102.txt">Tủ .txt</a>
    </div>
  </article>

  <article class="card">
    <div class="top">
      <div class="title-row">
        <span class="pill jpd">JPD123</span>
        <h2 class="title">Kanji JPD123</h2>
      </div>
      <span class="badge">41 câu thực chiến</span>
    </div>
    <div class="actions">
      <a class="btn primary jpd" href="https://duongnad.github.io/jpd123-kanji-quiz/">Vào làm Kanji →</a>
    </div>
  </article>
</main>
</body>
</html>
