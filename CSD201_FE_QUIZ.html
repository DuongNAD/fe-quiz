 → A, E; D → F; A → G; cuối cùng H (cô lập).","src":["SP26-RE"]},{"id":135,"q":"Given the weighted directed graph below, you use Dijkstra's algorithm to find the shortest path from vertex H to vertex T. What is the correct order of vertices selected into the set S until T is selected?","fig":{"type":"graph","dir":true,"nodes":{"H":[6,50],"A":[40,8],"B":[40,50],"C":[40,92],"D":[86,50],"T":[86,92]},"edges":"H>A:4 H>B:7 H>C:6 A>B:1 A>D:6 B>D:4 B>C:5 D>T:6 C>T:2"},"o":["H, A, B, D, T","H, B, D, T","H, C, T","H, A, B, C, T"],"a":[3],"n":"H(0) → A(4) → B(4+1=5) → C(6) → T(6+2=8). D = 9 chưa kịp chọn.","src":["SP26-RE","C2FA25-FE"]},{"id":136,"q":"Consider the graph below. One cut-edge (bridge) in the graph is","fig":{"type":"graph","nodes":{"a":[6,10],"d":[30,10],"b":[6,90],"c":[30,90],"f":[62,10],"g":[94,10],"e":[62,90],"h":[94,90]},"edges":"a-b b-d d-c b-c c-e e-f f-g e-g g-h e-h"},"o":["{b, d}","{c, e}","{b, c}","{f, g}"],"a":[1],"n":"Bỏ cạnh c-e, đồ thị tách thành 2 phần → cạnh cầu.","src":["SP26-RE","C1FA25-FE"]},{"id":137,"q":"Given the weighted graph below, what is the total edge weight of the minimum spanning tree of G?","fig":{"type":"graph","nodes":{"A":[8,48],"B":[44,10],"C":[44,48],"D":[44,90],"E":[92,48],"F":[92,90]},"edges":"A-B:13 A-C:6 B-C:4 A-D:8 C-D:7 C-E:12 E-F:10 D-F:16"},"o":["45","42","35","39","40"],"a":[3],"n":"Kruskal: 4 (B-C), 6 (A-C), 7 (C-D), bỏ 8, 10 (E-F), 12 (C-E) → 39.","src":["SP26-RE"]},{"id":138,"q":"Given the graph below, colors 1, 2, 3, ... are assigned with the sequential coloring algorithm that orders vertices in decreasing order of their degrees (largest first). What is the color of vertex D?","fig":{"type":"graph","nodes":{"A":[8,44],"B":[44,8],"C":[44,44],"D":[44,92],"E":[90,44],"F":[90,92],"G":[66,68]},"edges":"A-B A-C A-G A-D B-C B-E C-E E-G E-F D-F"},"o":["1","2","3","4","5"],"a":[1],"n":"Thứ tự A(4), E(4), B(3), C(3), D, F, G. A=E=1, B=2, C=3, D (kề A=1) = 2.","src":["SP26-RE","C2FA25-FE"]},{"id":139,"q":"Select the most correct statement.","o":["In all cases the selection sort is O(n^2)","In the worst case the selection sort is O(n^2), in the best case it is O(n)","In the worst case the selection sort is O(n^2), in the best case it is O(n log n)","In the average case the selection sort is O(n^2), in the best case it is O(n log n)"],"a":[0],"n":"Selection sort luôn so sánh n(n-1)/2 lần, kể cả khi mảng đã sắp.","src":["SP26-RE","FA25-RE","C1FA25-FE","SU25-B5-RE"]},{"id":140,"q":"Select the most correct statement.","o":["In all cases the insertion sort is O(n^2)","The complexity of insertion sort is O(n^2); in the best case it is O(n)","The complexity of insertion sort is O(n log n); in the best case it is O(n)","The complexity of insertion sort is O(n^2); in the best case it is O(n log n)"],"a":[1],"n":"Mảng đã sắp: mỗi phần tử chỉ so 1 lần → O(n).","src":["SP26-RE","FA25-RE","C2FA25-FE","C1FA25-FE","SU25-B5-RE"]},{"id":141,"q":"Specify the correct statement about the open addressing method for handling collisions (select the best answer).","o":["Each position of the table is associated with a linked list or chain of structures whose info fields store keys or references to keys","The collision is resolved by finding an available table entry other than the position to which the colliding key is originally hashed","The collision is resolved by finding a free memory area to store any collision","A free memory area is opened for storing keys"],"a":[1],"n":"Open addressing tìm ô trống khác trong bảng (linear, quadratic, double hashing). A là chaining.","src":["SP26-RE"]},{"id":142,"q":"Select the most correct statement about the complexity of heapsort.","o":["The best case is O(n), and the worst case is O(n^2)","The best case is O(n), and the worst case is O(n log n)","Best case is O(n log n), the worst case is O(n^2)","Both best and worst cases are O(n log n)"],"a":[3],"n":"Heapsort luôn O(n log n).","src":["SP26-RE","C1FA25-FE"]},{"id":143,"q":"Given h(x) = x % M with M = 10 and linear probing, how does the hash table look after inserting the keys 95, 64, 21, 203, 44, 144 sequentially?","o":["1:21, 3:203, 4:64, 5:95, 6:44, 7:144","1:21, 3:203, 4:64, 5:95, 6:144, 7:44","1:21, 3:203, 4:64, 5:95, 8:44, 9:144","1:21, 3:203, 4:64, 5:95, 8:144, 9:44"],"a":[0],"n":"44 → 4, 5 bị chiếm → 6. 144 → 4, 5, 6 bị chiếm → 7.","src":["SP26-RE"]},{"id":144,"q":"Given h(x) = x % M with M = 10 and quadratic probing ((h(x) + i^2) % M, i = 1, 2, ...), how does the hash table look after inserting the keys 65, 76, 96, 205 sequentially?","o":["1:205, 5:65, 6:76, 8:96","0:205, 5:65, 6:76, 7:96","5:65, 6:76, 7:96, 8:205","5:65, 6:76, 7:96, 9:205"],"a":[3],"n":"96 → 6 bị chiếm → 6+1 = 7. 205 → 5 bị chiếm → 5+1 = 6 bị chiếm → 5+4 = 9.","src":["SP26-RE","C1FA25-FE"]},{"id":145,"q":"Specify the correct statement about the chaining method for handling collisions.","o":["In chaining, some positions of the table are associated with a linked list or chain of structures whose info fields store keys or references to keys","In this method, the table can never overflow if free memory is available, because the linked lists are extendible","In chaining, a linked list is used instead of an array for the hash table","None of the others"],"a":[1],"n":"Mỗi ô có danh sách liên kết mở rộng được nên bảng không tràn. A sai vì MỌI vị trí (không phải 'một số') gắn với một chuỗi.","src":["SP26-RE","C1FA25-FE"]},{"id":146,"q":"True or false: Run-length encoding is a lossless compression method in which repeated occurrences of a symbol are replaced by one occurrence of the symbol followed by the number of occurrences.","o":["True","False"],"a":[0],"n":"RLE là nén không mất mát, thay chuỗi lặp bằng (ký hiệu, số lần).","src":["SP26-RE","C2FA25-FE","SU25-B5-RE"]},{"id":147,"q":"Given the raw message 'FFFFOOOOFFFOOFFFFFOO', run the run-length encoding algorithm. What is the output?","o":["4F4O3F2O5F","FFFFOOOOFFFOOFFFFFOO","4F4O3F2O5F2O","4F4O3F2O5F2OO"],"a":[2],"n":"FFFF OOOO FFF OO FFFFF OO → 4F4O3F2O5F2O.","src":["SP26-RE"]},{"id":148,"q":"Using the Huffman code tree below (left edge = 0, right edge = 1), what is the result of decoding the string 1100000001100?","fig":{"type":"huff","t":"*(*(B,C),A)"},"o":["CAABBBBA","AABBABAB","AABBBBBA","AABBBCAB"],"a":[3],"n":"A=1, B=00, C=01: 1|1|00|00|00|01|1|00 → A A B B B C A B.","src":["SP26-RE"]},{"id":149,"q":"Suppose you use the LZW algorithm to encode the message AABCAAAABD; the dictionary at the beginning of encoding is (1) A, (2) B, (3) C, (4) D. What string is denoted by code word (7)?","o":["CA","BC","BCA","CAA"],"a":[1],"n":"Thêm lần lượt AA=5, AB=6, BC=7.","src":["SP26-RE","FA25-RE","C2FA25-FE","SU25-B5-RE"]},{"id":150,"q":"Consider the function below. What is the value of fun(3)?","code":"int fun(int n) {\n  if (n == 1 || n == 2) return(1);\n  else return(fun(n-1) + 3*fun(n-2));\n}","o":["5","12","3","4","11"],"a":[3],"n":"fun(3) = fun(2) + 3·fun(1) = 1 + 3 = 4.","src":["SP26-FE","FA25-RE","C2FA25-FE"]},{"id":151,"q":"Select the most correct statement. Basically, the complexity of counting the number of items in a doubly linked list is","o":["O(n)","O(n^2)","O(n log n)","O(1)"],"a":[0],"n":"Phải duyệt toàn bộ danh sách (nếu không lưu sẵn biến size).","src":["SP26-FE"]},{"id":152,"q":"Suppose we are considering a singly linked list and p is some node in the list which has a successor node. Select the most correct Java code snippet that deletes the successor node of p (the node after p).","o":["Node q = p.next;\nq.next = p.next.next;","p = p.next;\np.next = null;","Node q = p.next;\np.next = q.next;","p.next = null;"],"a":[2],"n":"q là nút sau p; nối p.next = q.next để bỏ qua q. D làm mất cả phần đuôi.","src":["SP26-FE"]},{"id":153,"q":"The operation of visiting each element in the list exactly once is known as","o":["Inserting","Merging","Traverse","Sorting"],"a":[2],"n":"Duyệt (traverse) = thăm mỗi phần tử đúng một lần.","src":["SP26-FE"]},{"id":154,"q":"Fill in the blank to form the most correct statement: In a ______ every element contains some data and a link to the next element, which allows the structure to be kept.","o":["binary search tree","doubly linked list","singly linked list","skip list"],"a":[2],"n":"Chỉ có link tới phần tử kế tiếp → DSLK đơn.","src":["SP26-FE","C2FA25-FE"]},{"id":155,"q":"Select the most correct statement:","o":["In a linked list, the tail node is introduced for performance purpose only","In a linked list, there must be the tail node","The tail node is necessary for inserting a node after the last node","The tail node is necessary for inserting a node before the last node"],"a":[0],"n":"tail chỉ để chèn cuối nhanh (O(1)); không có tail vẫn làm được bằng cách duyệt.","src":["SP26-FE","C2FA25-FE","SU25-B5-RE"]},{"id":156,"q":"Suppose a doubly linked list of integers is given: (head) 7 11 6 4 3 12 8 2 (tail), and p is a reference to the node with value 12. What does the list look like after the following Java code snippet is run?","code":"int x = 5;\nNode f = p.prev;\nNode q = new Node(x);\nq.prev = f; q.next = p;\nf.next = q; p.prev = q;","o":["7 11 6 4 3 12 8 2 5","7 11 6 4 3 5 12 8 2","7 11 6 4 3 12 5 8 2","7 5 11 6 4 3 12 8 2","5 7 11 6 4 3 12 8 2"],"a":[1],"n":"Chèn 5 trước 12.","src":["SP26-FE","FA25-RE"]},{"id":157,"q":"Which statements are true? (Select two)","o":["In a singly linked list there is no efficient way to insert a node before a given node in the middle of the list (an action is considered efficient if its complexity is O(1))","In a singly linked list we can insert a node after a given node with time complexity O(1)","In a singly linked list we can insert a node after a given node with time complexity O(n)","In a singly linked list we can insert a node before a given node in the middle of the list with time complexity O(1)"],"a":[0,1],"n":"Chèn sau nút đã biết: O(1). Chèn trước: phải tìm nút đứng trước → O(n).","src":["SP26-FE","FA25-RE","C2FA25-FE","SU25-B5-RE"]},{"id":158,"q":"Suppose a doubly linked list of integers is given: (head) 27 11 6 4 3 10 8 2 (tail), and p is a reference to the node with value 10. What does the list look like after the following Java code snippet is run?","code":"int x = 19;\nNode p1, p2;\np1 = new Node(x);\np2 = p.next;\np.next = p1; p1.prev = p;\np1.next = p2; p2.prev = p1;","o":["27 11 6 4 3 10 8 2 19","27 11 6 4 3 19 10 8 2","27 11 6 4 3 10 19 8 2","27 19 11 6 4 3 10 8 2","19 27 11 6 4 3 10 8 2"],"a":[2],"n":"Chèn 19 sau 10.","src":["SP26-FE","FA25-RE"]},{"id":159,"q":"Suppose a doubly linked list of integers is given: (head) 7 1 6 4 31 17 8 2 (tail), and p is a reference to the node with value 17. What does the list look like after the following Java code snippet is run?","code":"int x = 13;\nNode f = p.prev;\nNode q = new Node(x);\nq.prev = f; q.next = p;\nf.next = q; p.prev = q;","o":["7 1 6 4 31 17 8 2 13","7 1 6 4 31 13 17 8 2","7 1 6 4 31 17 13 8 2","7 13 1 6 4 31 17 8 2","13 7 1 6 4 31 17 8 2"],"a":[1],"n":"Chèn 13 trước 17.","src":["SP26-FE","FA25-RE","C2FA25-FE","SU25-B5-RE"]},{"id":160,"q":"Specify the correct implementation of the dequeue() method of a queue. This queue uses java.util.ArrayList for storing data and the head of the list is treated as the head of the queue.","o":["Object dequeue() {\n  if (isEmpty()) return(null);\n  return(pool.remove(pool.size()));\n}","void dequeue(Object x) {\n  if (isEmpty()) return(null);\n  pool.remove(pool.size()-1);\n}","Object dequeue() {\n  if (isEmpty()) return;\n  return(pool.remove(pool.size()-1));\n}","Object dequeue() {\n  if (isEmpty()) return(null);\n  return(pool.remove(0));\n}"],"a":[3],"n":"Đầu queue là phần tử 0 → remove(0).","src":["SP26-FE"]},{"id":161,"q":"The operation for adding an entry to a stack is traditionally called:","o":["push","append","insert","add"],"a":[0],"n":"Stack: push / pop.","src":["SP26-FE"]},{"id":162,"q":"Consider the pseudocode: declare a stack of characters; for each character read: if it is '*' then pop and write the popped character to the screen, else push the character. What is written to the screen for the input \"GoodM**orn****in*g\"?","o":["Mdnrono","Mdnroon","MdnrooG","Mdonroo"],"a":[1],"n":"** → M, d; **** → n, r, o, o; * → n → \"Mdnroon\".","src":["SP26-FE"]},{"id":163,"q":"Consider the pseudocode: declare a stack of characters; for each character read: if it is '*' then pop the stack, else push the character. Then, while the stack is not empty, pop and write the popped character. What is written for the input \"GoodM**orn****in*g\"?","o":["gioG","gioM","giod","Goig"],"a":[0],"n":"Stack còn G o i g; pop hết: g i o G.","src":["SP26-FE"]},{"id":164,"q":"Consider the pseudocode: declare a queue of characters; for each character read: if it is '*' then dequeue and write the dequeued character to the screen, else enqueue the character. What is written for the input \"GoodA**fter***Noo*n\"?","o":["Adoretfo","GoodAf","odAfter","GoodA"],"a":[1],"n":"** → G, o; *** → o, d, A; * → f → \"GoodAf\".","src":["SP26-FE"]},{"id":165,"q":"Consider the pseudocode: declare a queue of characters implemented by a circular array of size 6 (indices 0-5); for each character read: if it is '*' then dequeue, else enqueue. How does the queue look after processing the input \"Hello****Worl**d*\"? (cells holding the queue's elements)","o":["[0]=d [4]=r [5]=l","[0]=l [1]=d [5]=r","[0]=r [1]=l [2]=d","[1]=r [2]=l [3]=d"],"a":[3],"n":"H,e,l,l,o ở 0-4; **** → front=4. W,o,r,l vào 5,0,1,2. ** bỏ o(4), W(5). d vào 3. * bỏ o(0) → còn r l d ở ô 1-3.","src":["SP26-FE","C2FA25-FE"]},{"id":166,"q":"An algorithm that calls itself directly or indirectly is known as","o":["Polish notation","Sub algorithm","Recursion","Traversal algorithm"],"a":[2],"n":"Đệ quy (trực tiếp hoặc gián tiếp).","src":["SP26-FE"]},{"id":167,"q":"Consider the function below. What is the output when the statement fun(9); is run?","code":"void fun(int n) {\n  if (n > 0) {\n    fun(n-2);\n    System.out.print(\" \" + n);\n  }\n}","o":["1 3 5 7 9","9 7 5 3","9 7 5 3 1","7 5 3 1"],"a":[0],"n":"In SAU lời gọi đệ quy nên in từ nhỏ đến lớn: 1 3 5 7 9.","src":["SP26-FE"]},{"id":168,"q":"Consider the function below. What value of X in printOut(X); will print EXACTLY 5 lines to standard output (lines starting with \"StdOut:\"), in the fewest number of recursive calls?","code":"void printOut(int count) {\n  if ((count % 2) == 0)\n    System.err.println(\"StdErr: Line \" + count + \"\\n\");\n  else\n    System.out.println(\"StdOut: Line \" + count + \"\\n\");\n  if (count == 0) return;\n  else printOut(count-1);\n}","o":["9","10","8","11"],"a":[0],"n":"Số lẻ in ra stdout: 9, 7, 5, 3, 1 → đúng 5 dòng. X = 10 cũng 5 dòng nhưng gọi nhiều hơn.","src":["SP26-FE"]},{"id":169,"q":"Consider the function below. Which call will result in the most recursive calls?","code":"int fun(int n) {\n  if (n < 0) return(fun(-n));\n  else if (n < 5) return(2);\n  else return(n*fun(n/2));\n}","o":["fun(-1012);","fun(100);","fun(0);","fun(1012);"],"a":[0],"n":"fun(-1012) = 1 lần đổi dấu + toàn bộ chuỗi của fun(1012).","src":["SP26-FE"]},{"id":170,"q":"Consider the function below. What is the output when the statement fun(5); is run?","code":"void fun(int n) {\n  if (n <= 0)\n    System.out.println(\"Hello\");\n  else {\n    for (int i = 0; i < n; i++)\n      System.out.print(\"$\");\n    System.out.println();\n    fun(n - 2);\n  }\n}","o":["Hello / $$$$$ / $$$ / $","$$$$$ / $$$ / $ / Hello","$$$$ / $$ / $ / Hello","$ / $$$ / $$$$$ / Hello"],"a":[1],"n":"n = 5, 3, 1 in 5, 3, 1 dấu $; n = -1 in Hello.","src":["SP26-FE","FA25-RE"]},{"id":171,"q":"In a max heap tree, ______","o":["Values in a node are greater than every value in its left subtree and smaller than its right subtree","Values in a node are greater than every value in the children of it","Both of the other conditions apply"],"a":[1],"n":"Max heap: cha ≥ con. A là tính chất của BST.","src":["SP26-FE","C2FA25-FE"]},{"id":172,"q":"The in-order traversal of a tree will yield a sorted listing of elements of the tree in","o":["Binary trees","Binary search trees","Heaps","None of others"],"a":[1],"n":"In-order trên BST cho dãy tăng dần.","src":["SP26-FE","C2FA25-FE","SU25-B5-RE"]},{"id":173,"q":"What is the result of the breadth-first traversal of the binary search tree T after inserting the following keys sequentially (T is empty before insertion): 16, 7, 3, 1, 12, 20, 17","o":["16, 7, 20, 3, 12, 1, 17","16, 7, 20, 3, 17, 1, 12","16, 7, 20, 3, 17, 12, 1","16, 7, 20, 3, 12, 17, 1"],"a":[3],"n":"Cây: 16 → (7 → 3 → 1, 12), (20 → 17). Theo mức: 16 | 7, 20 | 3, 12, 17 | 1.","src":["SP26-FE","FA25-RE","C1FA25-FE"]},{"id":174,"q":"What is the breadth-first traversal of the tree below after deleting the node 5 by merging?","fig":{"type":"tree","t":"5(2(1,4(3,)),7(6,8))"},"o":["2, 1, 4, 3, 7, 8, 6","2, 1, 4, 3, 7, 6, 8","4, 2, 7, 1, 3, 6, 8","2, 1, 4, 3, 6, 7, 8"],"a":[1],"n":"4 (phải nhất cây con trái) nhận 7(6,8) làm con phải; 2 lên gốc: 2(1,4(3,7(6,8))).","src":["SP26-FE"]},{"id":175,"q":"What is the breadth-first traversal of the tree below after deleting the node 30 by copying?","fig":{"type":"tree","t":"30(15(5(,10),25(20,)),40(35,))"},"o":["15, 5, 25, 10, 20, 40, 35","25, 15, 40, 5, 20, 35, 10","15, 5, 25, 20, 10, 40, 35","15, 5, 40, 10, 35, 25, 20"],"a":[1],"n":"Chép 25 (lớn nhất cây con trái) lên gốc, 20 thay chỗ 25: 25(15(5(,10),20),40(35,)).","src":["SP26-FE","C2FA25-FE"]},{"id":176,"q":"Given the binary tree below, what is the result of the pre-order traversal?","fig":{"type":"tree","t":"1(3(4,5(7,)),2(,6(8,)))"},"o":["1, 3, 4, 5, 7, 2, 6, 8","1, 3, 4, 7, 5, 2, 6, 8","1, 3, 4, 5, 7, 2, 8, 6","4, 3, 7, 5, 1, 8, 6, 2"],"a":[0],"n":"Gốc-trái-phải: 1, 3, 4, 5, 7, 2, 6, 8.","src":["SP26-FE","FA25-RE"]},{"id":177,"q":"Consider the AVL tree below. What is the breadth-first traversal of the tree after inserting a node with value 24?","fig":{"type":"tree","t":"35(22(12,32(27,)),39(37,))"},"o":["35, 22, 39, 12, 32, 37, 24, 27","35, 22, 39, 12, 27, 37, 24, 32","35, 22, 39, 12, 32, 37, 27, 24","35, 22, 39, 12, 37, 27, 24, 32"],"a":[1],"n":"24 vào trái của 27 → nút 32 lệch trái 2 (LL) → quay phải tại 32: 27(24,32).","src":["SP26-FE","C2FA25-FE"]},{"id":178,"q":"Given the binary tree below, what is the result of the in-order traversal?","fig":{"type":"tree","t":"1(2(6,5(7,)),3(,4(8,)))"},"o":["1, 2, 6, 7, 5, 3, 4, 8","6, 2, 7, 5, 1, 8, 4, 3","6, 7, 5, 2, 8, 4, 3, 1","6, 2, 7, 5, 1, 3, 8, 4"],"a":[3],"n":"Trái-gốc-phải: 6, 2, 7, 5, 1, 3, 8, 4.","src":["SP26-FE"]},{"id":179,"q":"Given the binary search tree T below, what is the breadth-first traversal of T after you delete the root (node 5) by copying?","fig":{"type":"tree","t":"5(2(1,4(3,)),6(,8(7,)))"},"o":["2, 1, 4, 3, 6, 7, 8","2, 1, 4, 3, 6, 8, 7","4, 2, 6, 1, 3, 8, 7","4, 2, 6, 1, 3, 7, 8"],"a":[2],"n":"Chép 4 lên gốc, 3 thay chỗ 4: 4(2(1,3),6(,8(7,))).","src":["SP26-FE","FA25-RE","SU25-B5-RE"]},{"id":180,"q":"Given the binary search tree T below, what is the breadth-first traversal of T after you delete the node 3 by merging?","fig":{"type":"tree","t":"6(3(1(,2),4),8(7,9))"},"o":["6, 1, 8, 2, 4, 7, 9","6, 1, 8, 2, 7, 9, 4","6, 2, 8, 1, 4, 7, 9","6, 2, 1, 4, 8, 7, 9"],"a":[1],"n":"2 (phải nhất cây con trái) nhận 4 làm con phải; 1 thay 3: 6(1(,2(,4)),8(7,9)).","src":["SP26-FE","SU25-B5-RE"]},{"id":181,"q":"______ is a connected graph without any simple circuit.","o":["Kn","Tree","Simple graph","Pseudo graph"],"a":[1],"n":"Cây = đồ thị liên thông, không có chu trình.","src":["SP26-FE","FA25-RE","SU25-B5-RE"]},{"id":182,"q":"Suppose we are considering a binary search tree. Select the most correct Java code snippet that searches for a node with value x in the subtree with root p.","o":["Node search(Node p, int x) {\n  if (p.info == x) return(p);\n  if (x < p.info) return(search(p.left, x));\n  else return(search(p.right, x));\n}","Node search(Node p, int x) {\n  if (p == null) return(null);\n  if (p.info == x) return(p);\n  if (x < p.info) return(search(p.left, x));\n  else return(search(p.right, x));\n}","Node search(Node p, int x) {\n  if (p == null) return(null);\n  if (p.info == x) return(p);\n  if (x < p.info) return(search(p.right, x));\n  else return(search(p.left, x));\n}"],"a":[1],"n":"Cần điều kiện dừng p == null và đi trái khi x nhỏ hơn.","src":["SP26-FE","FA25-RE","C2FA25-FE","SU25-B5-RE"]},{"id":183,"q":"Given the weighted directed graph below, you use Dijkstra's algorithm to find the shortest path from vertex A to vertex C. What is the correct order of vertices selected into the set S until C is selected?","fig":{"type":"graph","dir":true,"nodes":{"A":[42,8],"B":[8,58],"C":[94,42],"D":[42,90],"E":[80,76]},"edges":"A>B:2 A>D:20 A>E:5 A>C:10 B>D:1 D>C:4 E>C:1 E>D:10"},"o":["A, B, C","A, B, D, C","A, B, D, E, C","A, B, E, C"],"a":[2],"n":"A(0) → B(2) → D(2+1=3) → E(5) → C(min(10, 3+4, 5+1) = 6).","src":["SP26-FE","FA25-RE"]},{"id":184,"q":"Given the graph below, what is the output of the breadth-first traversal from vertex B? (visit nodes in ABC order if several nodes can be selected)","fig":{"type":"graph","nodes":{"A":[8,58],"B":[30,36],"C":[52,10],"D":[80,34],"E":[46,58],"F":[66,60],"G":[38,84],"H":[92,62]},"edges":"A-B A-E A-G B-C B-E C-D D-F E-G F-G"},"o":["B, A, E, G, F, D, C, H","B, A, C, E, G, D, F","B, A, C, E, G, F, D, H","B, A, C, E, G, D, F, H"],"a":[3],"n":"B → A, C, E; A → G; C → D; G → F; cuối cùng H.","src":["SP26-FE","FA25-RE"]},{"id":185,"q":"Consider the graph below. The cut-vertices (articulation points) in the graph are","fig":{"type":"graph","nodes":{"a":[6,10],"d":[30,10],"b":[6,90],"c":[30,90],"f":[62,10],"g":[94,10],"e":[62,90],"h":[94,90]},"edges":"a-b b-d d-c b-c c-e e-f f-g e-g g-h e-h"},"o":["b, c, e","c, e, a","b, c, d","e, d, a"],"a":[0],"n":"Bỏ b → a tách riêng; bỏ c hoặc e → hai cụm bị cắt (c-e là cầu).","src":["SP26-FE","FA25-RE","C2FA25-FE","SU25-B5-RE"]},{"id":186,"q":"Given the graph below, colors 1, 2, 3, ... are assigned with the sequential coloring algorithm that orders vertices in decreasing order of their degrees (largest first). What is the color of vertex G?","fig":{"type":"graph","nodes":{"A":[8,40],"B":[52,6],"C":[52,30],"D":[52,86],"E":[94,40],"F":[94,86],"G":[76,62]},"edges":"A-B A-C A-G A-D B-E C-E G-E E-F D-F"},"o":["1","2","3","4","5"],"a":[1],"n":"A(4)=1, E(4)=1, B=C=D=2, F=3, G (kề A, E đều màu 1) = 2.","src":["SP26-FE"]},{"id":187,"q":"Given the weighted graph below, what is the total edge weight of the minimum spanning tree of G?","fig":{"type":"graph","nodes":{"A":[8,42],"B":[46,8],"C":[46,42],"D":[46,88],"E":[92,42],"F":[92,88]},"edges":"A-B:3 B-C:4 B-E:18 C-E:12 A-D:8 C-D:6 E-F:15 D-F:16"},"o":["41","25","43","40","48"],"a":[3],"n":"Kruskal: 3, 4, 6, (bỏ 8), 12, 15 → 40.","src":["SP26-FE","C2FA25-FE"]},{"id":188,"q":"Select the most correct statement about the complexity of insertion sort.","o":["Both best and worst cases are O(n^2)","The best case is O(n), and the worst case is O(n log n)","The best case is O(n log n), and the worst case is O(n^2)","The best case is O(n), and the worst case is O(n^2)"],"a":[3],"n":"Mảng đã sắp: O(n); sắp ngược: O(n^2).","src":["SP26-FE"]},{"id":189,"q":"Select the most correct statement about the complexity of selection sort.","o":["Both best and worst cases are O(n^2)","The best case is O(n), and the worst case is O(n^2)","The best case is O(n), and the average case is O(n log n)","The best case is O(n), and the average case is O(n^2)"],"a":[0],"n":"Selection sort luôn O(n^2).","src":["SP26-FE","C2FA25-FE"]},{"id":190,"q":"The complexity of heap sort is","o":["O(n log n)","O(log n)","O(n)","O(n^2)"],"a":[0],"n":"Xây heap O(n) + n lần lấy max O(log n) → O(n log n).","src":["SP26-FE","FA25-RE","C2FA25-FE","SU25-B5-RE"]},{"id":191,"q":"Specify the correct statement about the coalesced chaining method for handling collisions (select the best answer).","o":["In coalesced hashing, the linked list is created inside the hash table and a colliding key is put in the first available position of the table","In coalesced hashing, the linked list is created outside the hash table and colliding keys are put in the list connected to the colliding position of the table","Because in coalesced hashing the linked list is created inside the hash table, the searching must be carried out sequentially","In coalesced hashing, the linked list is created inside the hash table and a colliding key is put in the last available position of the table"],"a":[3],"n":"Coalesced hashing (Drozdek): chuỗi nằm trong bảng, khoá va chạm đặt vào ô trống CUỐI CÙNG của bảng rồi nối link.","src":["SP26-FE","C2FA25-FE"]},{"id":192,"q":"Given h(x) = x % M with M = 10 and linear probing, how does the hash table look after inserting the keys 74, 111, 110, 32, 101, 131 sequentially?","o":["0:110, 1:111, 2:32, 3:101, 4:74, 5:131","0:110, 1:111, 2:32, 4:74, 8:131, 9:101","0:110, 1:111, 2:32, 4:74, 8:101, 9:131","0:110, 1:111, 2:32, 3:131, 4:74, 5:101"],"a":[0],"n":"101 → 1, 2 bị chiếm → 3. 131 → 1, 2, 3, 4 bị chiếm → 5.","src":["SP26-FE","C2FA25-FE","SU25-B5-RE"]},{"id":193,"q":"Given h(x) = x % M with M = 10 and quadratic probing ((h(x) + i^2) % M, i = 1, 2, ...), how does the hash table look after inserting the keys 26, 97, 36, 106 sequentially?","o":["6:26, 7:97, 8:36, 9:106","0:36, 4:106, 6:26, 7:97","1:36, 5:106, 6:26, 7:97","0:36, 5:106, 6:26, 7:97"],"a":[3],"n":"36 → 6, 7 bị chiếm → (6+4)%10 = 0. 106 → 6, 7, 0 bị chiếm → (6+9)%10 = 5.","src":["SP26-FE","C2FA25-FE"]},{"id":194,"q":"Specify the correct statement about the chaining method for handling collisions.","o":["In chaining, each position of the table is associated with a linked list or chain of structures whose info fields store keys or references to keys","In chaining, only some positions of the table are associated with a linked list or chain of structures","In chaining, a linked list is used instead of an array for the hash table","None of others"],"a":[0],"n":"Mỗi vị trí bảng gắn với một danh sách liên kết.","src":["SP26-FE","FA25-RE","C2FA25-FE","SU25-B5-RE"]},{"id":195,"q":"Specify the reason for data compression (select the best answer):","o":["Saving network bandwidth","Saving data storage","Increasing system performance","Just compress data for individual hobby"],"a":[1],"n":"Theo đáp án cộng đồng: tiết kiệm dung lượng lưu trữ (giảm băng thông cũng là hệ quả).","flag":true,"src":["SP26-FE"]},{"id":196,"q":"Given the raw message 'BBBBQQQQBBBQQBBBBBQQ', run the run-length encoding algorithm. What is the output?","o":["B4Q4B3Q2B5QQ2","4B4Q3B2Q5B2Q","4B4Q3B2Q5B","4B4Q3B2Q5B2QQ"],"a":[1],"n":"BBBB QQQQ BBB QQ BBBBB QQ → 4B4Q3B2Q5B2Q.","src":["SP26-FE","C2FA25-FE"]},{"id":197,"q":"Suppose you use the LZW algorithm to encode the message AABAACAABD; the dictionary at the beginning of encoding is (1) A, (2) B, (3) C, (4) D. What string is denoted by code word (7)?","o":["AB","AC","BA","ABA","BAA"],"a":[2],"n":"Thêm lần lượt AA=5, AB=6, BA=7.","src":["SP26-FE"]},{"id":198,"q":"Using the Huffman code tree below (left edge = 0, right edge = 1), what is the result of decoding the string 0111000000101?","fig":{"type":"huff","t":"*(*(B,C),A)"},"o":["CAABBBAC","CAABABAB","BABABCBC","CAABBCAB"],"a":[0],"n":"01|1|1|00|00|00|1|01 → C A A B B B A C.","src":["SP26-FE","SU25-B5-RE"]},{"id":199,"q":"The elements of an array are stored successively in memory cells because","o":["by this way the computer can keep track only of the address of the first element, and the addresses of other elements can be calculated","the architecture of computer memory does not allow arrays to store other than serially"],"a":[0],"n":"Địa chỉ phần tử i = địa chỉ đầu + i × kích thước phần tử.","src":["SP26-FE"]},{"id":200,"q":"True or false: \"Recursion bears substantial overhead. Each time the program calls a method, the system must assign space for all of the method's local variables and parameters. This can consume considerable memory and requires extra time to manage the additional space.\"","o":["True","False"],"a":[0],"n":"Mỗi lần gọi đệ quy tạo một activation record mới trên stack → tốn bộ nhớ và thời gian.","src":["FA25-RE","C2FA25-FE"]},{"id":201,"q":"You are given a singly linked list with at least 3 elements, and p is a reference to a middle node (p is neither the head nor the tail node). Select the statement about deleting the node p from the list that is most correct.","o":["Deleting the node p always takes O(n) time","Deleting the node p always takes O(1) time","We can delete the node p by moving the data from the next node into the p node and then deleting the next node by statement p.next = p.next.next; this solution has O(1) runtime","We can find the node f before the node p and then delete p by statement f.next = p.next; this solution has O(1) runtime"],"a":[2],"n":"Mẹo chép dữ liệu nút sau vào p rồi xoá nút sau: O(1). Cách D đúng nhưng tìm f mất O(n).","src":["FA25-RE"]},{"id":202,"q":"Select the most correct statement. Suppose we are considering a singly linked list and p is some node in the list which has a predecessor node. What does the Java code snippet below do?","code":"Node f = head;\nwhile (f.next != p) f = f.next;\nNode q = new Node(x);\nq.next = p;\nf.next = q;","o":["It replaces the node p with a new node with value x","It inserts a new node with value x after the node p","It inserts a new node with value x before the node p","It creates a new node with value x at the end of the list"],"a":[2],"n":"f là nút trước p; chèn q giữa f và p.","src":["FA25-RE"]},{"id":203,"q":"Consider the pseudocode: declare a stack of characters; for each character read: if it is '*' then pop and write the popped character to the screen, else push the character. What is written to the screen for the input \"Go*od**Mor*ni*ng*Si*r\"?","o":["donrnoo","donrniM","odorigi","odoringi","odoringS"],"a":[2],"n":"o | d, o | r | i | g | i → \"odorigi\" (chú ý chỉ có 1 dấu * sau \"ni\").","src":["FA25-RE","C1FA25-FE"]},{"id":204,"q":"Consider the function below. What is the output when the statement fun(9); is run?","code":"void fun(int n) {\n  if (n > 0) {\n    System.out.print(\" \" + n);\n    fun(n-2);\n  }\n}","o":["1 3 5 7 9","9 7 5 3","9 7 5 3 1","7 5 3 1"],"a":[2],"n":"In TRƯỚC lời gọi đệ quy nên in từ lớn đến nhỏ: 9 7 5 3 1.","src":["FA25-RE"]},{"id":205,"q":"The height of a complete binary tree with n nodes is","o":["n log n","n log(n+1)","log2(n)","log2(n+1)"],"a":[3],"n":"Cây complete (mọi lá cùng mức) cao h có 2^h - 1 nút → h = log2(n+1).","src":["FA25-RE","C1FA25-FE"]},{"id":206,"q":"What is the breadth-first traversal of the tree below after deleting the node 25 by copying?","fig":{"type":"tree","t":"40(25(15(,20),35(30,)),50(45,))"},"o":["15, 20, 40, 35, 50, 45, 30","40, 35, 15, 50, 45, 30, 20","40, 20, 50, 15, 35, 45, 30","40, 15, 50, 35, 45, 30, 20"],"a":[2],"n":"Nút lớn nhất cây con trái của 25 là 20 → chép 20 lên 25, xoá lá 20: 40(20(15,35(30,)),50(45,)).","src":["FA25-RE"]},{"id":207,"q":"Consider the AVL tree below. What is the breadth-first traversal of the tree after inserting a node with value 27?","fig":{"type":"tree","t":"40(25(15,35(30,)),50(45,))"},"o":["40, 25, 50, 15, 35, 45, 30, 27","40, 25, 50, 15, 35, 45, 27, 30","40, 25, 50, 15, 30, 45, 27, 35","40, 25, 50, 15, 30, 45, 35, 27"],"a":[2],"n":"27 vào trái của 30 → nút 35 lệch trái 2 (LL) → quay phải tại 35: 30(27,35).","src":["FA25-RE","SU25-B5-RE"]},{"id":208,"q":"Given the binary tree below, what is the result of the in-order traversal?","fig":{"type":"tree","t":"1(2(6(7,),5),3(,4(8,)))"},"o":["1, 2, 6, 7, 5, 3, 8, 4","7, 6, 5, 2, 8, 4, 3, 1","7, 6, 2, 5, 1, 3, 8, 4","1, 2, 6, 7, 5, 3, 4, 8"],"a":[2],"n":"Trái-gốc-phải: 7, 6, 2, 5, 1, 3, 8, 4.","src":["FA25-RE"]},{"id":209,"q":"Given the binary search tree T below, what is the breadth-first traversal of T after you delete the node 3 by merging?","fig":{"type":"tree","t":"6(3(1(,2),4(,5)),8(7,))"},"o":["6, 1, 7, 2, 8, 5, 4","6, 2, 8, 1, 4, 7, 5","6, 1, 8, 2, 7, 4, 5","6, 2, 7, 1, 4, 8, 5"],"a":[2],"n":"2 nhận 4(,5) làm con phải; 1 thay 3: 6(1(,2(,4(,5))),8(7,)).","src":["FA25-RE","C1FA25-FE"]},{"id":210,"q":"What is the correct definition of a hash function? (Select the best answer)","o":["Hash function h(x) is a function which transforms a particular key x, be it a string, number, record, or the like, into a non-negative integer","Hash function h(x) is a function which transforms a particular key x, be it a string, number, record, or the like, into an index i = h(x) in the table T, where T[i] is used for storing an item having key x or its address","Hash function h(x) is a function which transforms a particular key x (string or number) into an index i = h(x) in the table T, where T[i] is used for storing an item having key x or its address","Hash function h(x) is a function which transforms a particular key x, be it a string, number, record, or the like, into a positive integer"],"a":[1],"n":"Định nghĩa đầy đủ: biến khoá bất kỳ thành chỉ số trong bảng T, nơi lưu phần tử (hoặc địa chỉ) có khoá đó.","src":["FA25-RE"]},{"id":211,"q":"Given h(x) = x % M with M = 10 and quadratic probing ((h(x) + i^2) % M, i = 1, 2, ...), how does the hash table look after inserting the keys 34, 65, 94, 204 sequentially?","o":["3:204, 4:34, 5:65, 9:94","2:204, 4:34, 5:65, 8:94","3:204, 4:34, 5:65, 8:94","4:34, 5:65, 8:94, 9:204"],"a":[2],"n":"94 → 4, 5 bị chiếm → 4+4 = 8. 204 → 4, 5, 8 bị chiếm → (4+9)%10 = 3.","src":["FA25-RE"]},{"id":212,"q":"True or false: In Huffman coding, both the sender and the receiver must have a copy of the same code in order for the decoded file to match the encoded file.","o":["True","False"],"a":[0],"n":"Bên nhận cần cùng cây/bảng mã Huffman mới giải mã đúng.","src":["FA25-RE","C1FA25-FE"]},{"id":213,"q":"Using the Huffman code tree below (left edge = 0, right edge = 1), what is the result of decoding the string 1000101010100?","fig":{"type":"huff","t":"*(A,*(B,C))"},"o":["BABABBBA","BAABBABA","BAABBBBA","CAABBBBA"],"a":[2],"n":"Cây này: A=0, B=10, C=11. 10|0|0|10|10|10|10|0 → B A A B B B B A.","src":["FA25-RE"]},{"id":214,"q":"Select the most correct statement. Suppose we are considering a doubly linked list which is not empty. What does the Java code snippet below do?","code":"Node q = new Node(x);\nq.prev = null;\nq.next = head;\nhead.prev = q;\nhead = q;","o":["It inserts a new node with value x after the head of the list","It inserts a new node with value x at the head of the list"],"a":[1],"n":"q trở thành head mới → chèn vào đầu danh sách.","src":["C2FA25-FE"]},{"id":215,"q":"Suppose we are considering a singly linked list which is not empty. Select the most correct Java code snippet that inserts a new node with value x at the tail of the list (the new node will be the last node in the list).","o":["Node q = new Node(x);\nq.next = null;","tail.next = new Node(x);\ntail.next = null;\ntail = tail.next;","Node q = new Node(x);\nq.next = null;\ntail.next = q;\ntail = q;","tail.next = new Node(x);\ntail.next.next = null;"],"a":[2],"n":"Nối tail.next = q rồi cập nhật tail = q. B ghi đè tail.next = null làm mất nút mới; D quên cập nhật tail.","src":["C2FA25-FE"]},{"id":216,"q":"Consider the fun() method in a singly linked list below. Specify the correct statement about fun().","code":"void fun() {\n  if (isEmpty()) return;\n  if (head == tail) head = tail = null;\n  else {\n    Node p1, p; p1 = null; p = head;\n    while (p != tail) { p1 = p; p = p.next; }\n    p1.next = null; tail = p1;\n  }\n}","o":["It removes a node in the middle of the list","It removes a node at the beginning of the list","It removes a node at the end of the list","The code does not change the list"],"a":[2],"n":"p1 dừng ở nút áp chót; cắt p1.next và cho tail = p1 → xoá nút cuối.","src":["C2FA25-FE"]},{"id":217,"q":"Consider the pseudocode: declare a stack of characters; for each character read: if it is '*' then pop and write the popped character to the screen, else push the character. What is written to the screen for the input \"Good**Mor*ni**ng*Si*r\"?","o":["donrioo","doringi","donrioG","donriMG","GooMorni"],"a":[1],"n":"** → d, o; * → r; ** → i, n; * → g; * → i → \"doringi\".","src":["C2FA25-FE"]},{"id":218,"q":"Consider the pseudocode: declare a stack of characters; for each character read: if it is '*' then pop the stack, else push the character. Then, while the stack is not empty, pop and write the popped character. What is written for the input \"GoodM**orn****in*gSir\"?","o":["riSgioG","riSgioM","riSgiod","Goig","riSgioMo"],"a":[0],"n":"Stack còn G o i g S i r; pop hết: r i S g i o G.","src":["C2FA25-FE"]},{"id":219,"q":"Consider the pseudocode: declare a queue of characters; for each character read: if it is '*' then dequeue and write the dequeued character to the screen, else enqueue the character. What is written for the input \"Goo**dAft***erno*on*S*r\"?","o":["GoodAfe","oodAfter","GoodAfte","tfAdooGo"],"a":[2],"n":"** → G, o; *** → o, d, A; * → f; * → t; * → e → \"GoodAfte\".","src":["C2FA25-FE"]},{"id":220,"q":"Consider the function below. What is the output when the statement fun(3); is run?","code":"void fun(int n) {\n  if (n == 0)\n    System.out.println(\"Hello\");\n  else {\n    for (int i = 1; i <= n; i++)\n      System.out.print(\"$\");\n    System.out.println();\n    fun(n - 1);\n  }\n}","o":["Hello / $$$ / $$ / $","$ / $$ / $$$ / Hello","$$$ / $$ / $ / Hello","Hello / $ / $$ / $$$"],"a":[2],"n":"In 3, 2, 1 dấu $ rồi tới n = 0 in Hello.","src":["C2FA25-FE"]},{"id":221,"q":"What is the result of the breadth-first traversal of the binary search tree T after inserting the following keys sequentially (T is empty before insertion): 19, 11, 6, 4, 15, 23, 20","o":["19, 11, 23, 6, 3, 15, 20","19, 11, 23, 6, 15, 4, 20","19, 11, 23, 6, 15, 20, 4","19, 11, 23, 6, 20, 4, 15"],"a":[2],"n":"Cây: 19 → (11 → 6 → 4, 15), (23 → 20). Theo mức: 19 | 11, 23 | 6, 15, 20 | 4.","src":["C2FA25-FE"]},{"id":222,"q":"Given the binary search tree T below, what is the breadth-first traversal of T after you delete the root (node 5) by copying?","fig":{"type":"tree","t":"5(2(1,4(3,)),7(,8(,9)))"},"o":["4, 2, 7, 1, 3, 8, 9","4, 2, 7, 1, 8, 3, 9","2, 1, 4, 7, 8, 3, 9","2, 1, 4, 3, 7, 8, 9"],"a":[0],"n":"Chép 4 lên gốc, 3 thay chỗ 4: 4(2(1,3),7(,8(,9))).","src":["C2FA25-FE"]},{"id":223,"q":"A graph that has neither self-loops nor parallel edges is called a ______.","o":["simple graph","multigraph","pseudograph","connected graph"],"a":[0],"n":"Simple graph: không khuyên, không cạnh song song. Multigraph cho phép cạnh song song, pseudograph cho phép thêm khuyên.","src":["C2FA25-FE"]},{"id":224,"q":"Using the Huffman code tree below (left edge = 0, right edge = 1), what is the result of decoding the string 1100001000100?","fig":{"type":"huff","t":"*(*(B,C),A)"},"o":["CAABBBAC","AABBABCB","AABBBCBC","AABBBCAB"],"a":[1],"n":"A=1, B=00, C=01: 1|1|00|00|1|00|01|00 → A A B B A B C B.","src":["C2FA25-FE"]},{"id":225,"q":"Specify the correct statement about a binary search tree (select the most suitable one).","o":["It is necessary to build a tree with optimized height to stimulate the searching operation","In a binary search tree, all the nodes that are left descendants of node A have key values greater than A; all the nodes that are A's right descendants have key values less than (or equal to) A","The main purpose of balancing a tree is to keep the tree in good shape","For better searching performance, a tree should be in back-bone shape"],"a":[0],"n":"Chiều cao càng thấp tìm kiếm càng nhanh. B đảo ngược quy tắc BST; cây dạng 'xương sống' (danh sách) là tệ nhất.","src":["C1FA25-FE"]},{"id":226,"q":"Select the most correct statement. Basically, the complexity of inserting a node before a given node in a doubly linked list is","o":["O(1)","O(n)","O(log n)","O(n^2)"],"a":[0],"n":"DSLK đôi có p.prev nên chèn trước p chỉ cần đổi vài con trỏ.","src":["C1FA25-FE"]},{"id":227,"q":"Select the most correct statement. Suppose we are considering a doubly linked list and p is some node in the list which has a successor node. What does the Java code snippet below do?","code":"Node p1, p2;\np1 = new Node(x);\np2 = p.next;\np.next = p1; p1.prev = p;\np1.next = p2; p2.prev = p1;","o":["It inserts a new node with value x after the node p","It inserts a new node with value x before the node p","It replaces the node p with a new node with value x","It creates a new node with value x at the end of the list"],"a":[0],"n":"p1 được nối giữa p và p2 = p.next → chèn sau p.","src":["C1FA25-FE"]},{"id":228,"q":"Select the most correct statement. Basically, the complexity of finding the position of the minimum value in a doubly linked list of integers is","o":["O(1)","O(n)","O(log n)","O(n^2)"],"a":[1],"n":"Danh sách không có thứ tự → phải duyệt hết n phần tử.","src":["C1FA25-FE","SU25-B5-RE"]},{"id":229,"q":"True or false: In a linked list, the tail node is introduced for performance purposes only.","o":["False","True"],"a":[1],"n":"tail chỉ giúp thao tác ở cuối nhanh hơn; danh sách vẫn hoạt động khi không có tail.","src":["C1FA25-FE"]},{"id":230,"q":"Which of the following stack operations could result in stack underflow?","o":["isEmpty","pop","push","None of these"],"a":[1],"n":"Underflow = pop khi stack rỗng.","src":["C1FA25-FE"]},{"id":231,"q":"Consider the pseudocode: declare a stack of characters; for each character read: if it is '*' then pop the stack, else push the character. Then, while the stack is not empty, pop and write the popped character. What is written for the input \"Good*Mor**ni***ng\"?","o":["gnodo","gnooM","gnooG","Goong"],"a":[2],"n":"Stack còn G o o n g; pop hết: g n o o G.","src":["C1FA25-FE"]},{"id":232,"q":"Consider the pseudocode: declare a queue of characters; for each character read: if it is '*' then dequeue and write the dequeued character to the screen, else enqueue the character. What is written for the input \"Goo*dA**ft**erno***on\"?","o":["etfAdooG","GoodAft","oodAftern","GoodAfte"],"a":[3],"n":"* → G; ** → o, o; ** → d, A; *** → f, t, e → \"GoodAfte\".","src":["C1FA25-FE"]},{"id":233,"q":"Consider the binarySearch() function below. Suppose the array a is given by int[] a = {2, 4, 6, 8, 10, 12, 14, 16}. For the call binarySearch(a, 7, 2, 5), how many calls will be made, including the original call?","code":"int binarySearch(int[] a, int x, int low, int high) {\n  int t, k;\n  if (low > high) return(-1);\n  k = (low + high) / 2;\n  if (a[k] == x) return(k);\n  if (x < a[k]) return(binarySearch(a, x, low, k-1));\n  else return(binarySearch(a, x, k+1, high));\n}","o":["3","2","4","5"],"a":[0],"n":"(2,5): k=3, a[3]=8 > 7 → (2,2): k=2, a[2]=6 < 7 → (3,2): low > high → dừng. Tổng 3 lần.","src":["C1FA25-FE"]},{"id":234,"q":"Consider the function below. What is the output when the statement fun(23); is run?","code":"void fun(int n) {\n  if (n > 0) {\n    n = n/5;\n    fun(n);\n    System.out.print(\" \" + n);\n  }\n}","o":["4 1","4 0","1 4","0 4"],"a":[3],"n":"fun(23): n = 4, gọi fun(4): n = 0, gọi fun(0) không làm gì, in 0; quay về in 4 → \"0 4\".","src":["C1FA25-FE"]},{"id":235,"q":"The function f(n) is defined as: f(n) = 2 if n = 0 or n = 1; f(n) = f(n-1) + 2f(n-2) if n > 1. What is the value of f(4)?","o":["22","23","24","21"],"a":[0],"n":"f(2) = 2 + 4 = 6; f(3) = 6 + 4 = 10; f(4) = 10 + 12 = 22.","src":["C1FA25-FE"]},{"id":236,"q":"What is the breadth-first traversal of the tree below after deleting the node 2 by merging?","fig":{"type":"tree","t":"5(2(1,4(3,)),7(6,8))"},"o":["5, 1, 7, 4, 6, 3, 8","5, 4, 7, 1, 3, 6, 8","5, 1, 7, 4, 6, 8, 3","5, 1, 7, 4, 3, 6, 8"],"a":[2],"n":"Cây con trái của 2 chỉ có 1 → 1 nhận 4(3,) làm con phải và thay chỗ 2: 5(1(,4(3,)),7(6,8)).","src":["C1FA25-FE"]},{"id":237,"q":"Given the binary tree below, what is the result of the in-order traversal?","fig":{"type":"tree","t":"1(3(6,5(7,)),2(,4(8,)))"},"o":["1, 3, 6, 7, 5, 2, 4, 8","6, 7, 5, 3, 8, 4, 2, 1","6, 3, 7, 5, 1, 2, 8, 4","1, 3, 6, 5, 7, 2, 8, 4"],"a":[2],"n":"Trái-gốc-phải: 6, 3, 7, 5, 1, 2, 8, 4.","src":["C1FA25-FE"]},{"id":238,"q":"Which of the following can be used to represent is an array in memory used for storing items or their addresses. It is used with a hash function h(x), which transforms a particular key x (a string, number, record, or the like) into an index i = h(x) in the table","Hash table T is an array in memory used for storing items. It is used with a hash function h(x), which transforms a particular key x (string or number) into an index i = h(x) in the table"],"a":[2],"n":"Đầy đủ nhất: lưu phần tử HOẶC địa chỉ của chúng, khoá bất kỳ được biến thành chỉ số trong bảng.","src":["C1FA25-FE"]},{"id":242,"q":"Given h(x) = x % M with M = 10 and linear probing, how does the hash table look after inserting the keys 25, 21, 14, 32, 41, 191 sequentially?","o":["1:21, 2:32, 3:191, 4:14, 5:25, 6:41","1:21, 2:32, 3:41, 4:14, 5:25, 6:191","1:21, 2:32, 4:14, 5:25","1:21, 2:32, 4:14, 5:25, 8:191, 9:41"],"a":[1],"n":"41 → 1, 2 bị chiếm → 3. 191 → 1..5 bị chiếm → 6.","src":["C1FA25-FE"]},{"id":243,"q":"Suppose you use the LZW algorithm to encode the message AABCADAB; the dictionary at the beginning of encoding is (1) A, (2) B, (3) C, (4) D. What string is denoted by code word (5)?","o":["AA","AB","AAB","ABC"],"a":[0],"n":"Chuỗi mới đầu tiên không có trong từ điển là AA → mã (5).","src":["C1FA25-FE"]},{"id":244,"q":"Linked lists are best suited","o":["for relatively permanent collections of data","when the size of the structure and the data in the structure are constantly changing"],"a":[1],"n":"DSLK cấp phát động, chèn/xoá linh hoạt → hợp dữ liệu thay đổi liên tục; dữ liệu cố định thì mảng tốt hơn.","src":["SU25-B5-RE"]},{"id":245,"q":"Select the most correct statement. Which of the following is the required condition for the binary search algorithm?","o":["There must be a mechanism to insert an element in the middle of the list","There should be direct access to the middle element in any sub-list","The list must be sorted","Binary search algorithm is always applicable for a list"],"a":[2],"n":"Điều kiện cốt lõi: dãy đã sắp xếp. Truy cập trực tiếp phần tử giữa cũng cần để đạt O(log n); cộng đồng chọn C.","flag":true,"src":["SU25-B5-RE"]},{"id":246,"q":"Consider the pseudocode: declare a stack of characters; for each character read: if it is '*' then pop and write the popped character to the screen, else push the character. What is written to the screen for the input \"Good**Morn**i***ng\"?","o":["donrioo","donrioM","donrioG","donriMG"],"a":[1],"n":"** → d, o; ** → n, r; *** → i, o, M → \"donrioM\".","src":["SU25-B5-RE"]},{"id":247,"q":"Consider the pseudocode: declare a stack of characters; for each character read: if it is '*' then pop the stack, else push the character. Then, while the stack is not empty, pop and write the popped character. What is written for the input \"FileComp**ress*ion***\"?","o":["seroCeli","seroCeliF","seroCelFi","seroCeliFn","Filreion"],"a":[1],"n":"** bỏ p, m; * bỏ s; *** bỏ n, o, i. Stack còn F i l e C o r e s; pop hết: s e r o C e l i F.","src":["SU25-B5-RE"]},{"id":248,"q":"Consider the pseudocode: declare a queue of characters; for each character read: if it is '*' then dequeue and write the dequeued character to the screen, else enqueue the character. What is written for the input \"HowAre**You**To*Day\"?","o":["HowAr","HowAre","owAreY","erAwoH"],"a":[0],"n":"** → H, o; ** → w, A; * → r → \"HowAr\" (chỉ 1 dấu * sau \"To\").","src":["SU25-B5-RE"]},{"id":249,"q":"Select the statement that is most correct.","o":["There is no difference between a recursive method and a non-recursive method","For a recursive method to terminate there must be one or more steps","For a recursive method to terminate there must be one or more limit conditions","A recursive method is a method that invokes itself directly or indirectly. For a recursive method to terminate there must be one or more base cases"],"a":[3],"n":"Định nghĩa đệ quy: tự gọi trực tiếp hoặc gián tiếp, và phải có ít nhất một base case để dừng.","src":["SU25-B5-RE"]},{"id":250,"q":"Consider the function below. Which call will result in the most recursive calls?","code":"void fun(int n) {\n  if (n < 0) {\n    System.out.println(\"-\");\n    fun(-n);\n  }\n  else if (n < 10) System.out.println(n);\n  else {\n    fun(n/10);\n    System.out.println(n%10);\n  }\n}","o":["fun(1023);","fun(100);","fun(0);","fun(-1023);"],"a":[3],"n":"fun(1023) → 102 → 10 → 1: 4 lần gọi. fun(-1023) thêm 1 lần đổi dấu → 5 lần, nhiều nhất.","src":["SU25-B5-RE"]},{"id":251,"q":"What is the result of the breadth-first traversal of the binary search tree T after inserting the following keys sequentially (T is empty before insertion): 7, 8, 3, 1, 2, 5, 9","o":["7, 3, 8, 1, 2, 5, 9","7, 3, 8, 1, 5, 2, 9","7, 3, 1, 2, 5, 8, 9","7, 3, 8, 1, 5, 9, 2"],"a":[3],"n":"Cây: 7 → (3 → 1 → 2, 5), (8 → 9). Theo mức: 7 | 3, 8 | 1, 5, 9 | 2.","src":["SU25-B5-RE"]},{"id":252,"q":"Given the binary tree below, what is the result of the pre-order traversal?","fig":{"type":"tree","t":"1(3(6,5(7,)),2(,4(8,)))"},"o":["1, 3, 6, 5, 7, 2, 8, 4","1, 3, 6, 7, 5, 2, 4, 8","6, 3, 7, 5, 1, 8, 4, 2","1, 3, 6, 5, 7, 2, 4, 8"],"a":[3],"n":"Gốc-trái-phải: 1, 3, 6, 5, 7, 2, 4, 8.","src":["SU25-B5-RE"]},{"id":253,"q":"Given the graph below, what is the output of the breadth-first traversal from vertex A? (visit nodes in ABC order if several nodes can be selected)","fig":{"type":"graph","nodes":{"A":[8,58],"B":[30,36],"C":[52,10],"D":[80,34],"E":[46,58],"F":[66,60],"G":[38,84],"H":[92,62]},"edges":"A-B A-E A-G B-C B-E C-D D-F E-G F-G"},"o":["A, B, E, G, C, F, D, H","A, B, E, G, C, F, D","A, B, C, E, G, F, D, H","A, B, E, G, F, D, C, H"],"a":[0],"n":"A → B, E, G; B → C; G → F; C → D; cuối cùng H (cô lập).","src":["SU25-B5-RE"]},{"id":254,"q":"Given h(x) = x % M with M = 10 and quadratic probing ((h(x) + i^2) % M, i = 1, 2, ...), how does the hash table look after inserting the keys 25, 96, 35, 105 sequentially?","o":["0:35, 4:105, 5:25, 6:96","4:105, 5:25, 6:96, 9:35","5:25, 6:96, 7:35, 8:105","4:105, 5:25, 6:96, 7:35"],"a":[1],"n":"35 → 5, 6 bị chiếm → 5+4 = 9. 105 → 5, 6, 9 bị chiếm → (5+9)%10 = 4.","src":["SU25-B5-RE"]},{"id":255,"q":"Given the raw message 'BBBUUUUBBBUUBBBBBUU', run the run-length encoding algorithm. What is the output?","o":["3B4U4B3U2B5UU2","3B4U3B2U5B","3B4U3B2U5B2U","3B4U3B2U5B2UU"],"a":[2],"n":"BBB UUUU BBB UU BBBBB UU → 3B4U3B2U5B2U.","src":["SU25-B5-RE"]}]</script>
<script>
(function () {
  "use strict";
  var BANK = JSON.parse(document.getElementById("bank").textContent);
  var EXAMS = ["SU26-RE", "SU26-FE", "SP26-RE", "SP26-FE", "FA25-RE", "C2FA25-FE", "C1FA25-FE", "SU25-B5-RE"];
  var PREFIX = "csd201_clean_v2.";
  var LEGACY_PREFIX = "csd201_clean_v1.";
  var L = "ABCDEFG";
  var $ = function (s) { return document.querySelector(s); };
  var esc = function (s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); };
  var store = {
    get: function (k, d) {
      try {
        var v = localStorage.getItem(PREFIX + k);
        if (v == null && LEGACY_PREFIX && (k === "wrong" || k === "theme")) {
          var leg = localStorage.getItem(LEGACY_PREFIX + k);
          if (leg != null) { localStorage.setItem(PREFIX + k, leg); v = leg; }
        }
        return v == null ? d : JSON.parse(v);
      } catch (e) { return d; }
    },
    set: function (k, v) { try { localStorage.setItem(PREFIX + k, JSON.stringify(v)); } catch (e) { /* ignore storage errors */ } }
  };

  var DEFAULT_PRESET = "fa26_hot";
  var PRESETS = [
    { id: "hot3", label: "★ Siêu tủ", hint: "Ra ≥ 3/8 đề (31 câu lõi cứng)" },
    { id: "fa26_hot", label: "🔥 Tủ nóng FA26", hint: "Lặp ≥ 2 đề & đã nghỉ ở SU26 (khuyên học trước)" },
    { id: "rep2", label: "Lặp ≥ 2 đề", hint: "Toàn bộ câu xuất hiện từ 2 đề trở lên" },
    { id: "no_su26", label: "Bỏ SU26", hint: "Toàn bộ SP26 + FA25 + SU25 (né kỳ vừa thi)" },
    { id: "all", label: "Tất cả", hint: "Toàn bộ 255 câu gốc" }
  ];
  function inSU26(q) {
    return q.src.indexOf("SU26-FE") >= 0 || q.src.indexOf("SU26-RE") >= 0;
  }
  function matchPreset(q, pid) {
    if (pid === "hot3") return q.src.length >= 3;
    if (pid === "fa26_hot") return q.src.length >= 2 && !inSU26(q);
    if (pid === "rep2") return q.src.length >= 2;
    if (pid === "no_su26") return !inSU26(q);
    return true;
  }

  var ids = {};
  BANK.forEach(function (q) { ids[q.id] = true; });
  var validPresets = {};
  PRESETS.forEach(function (p) { validPresets[p.id] = true; });

  var wrong = new Set((store.get("wrong", []) || []).filter(function (id) { return ids[id]; }));
  var DEF = { mode: "practice", count: "all", exams: [], repeatOnly: false, preset: DEFAULT_PRESET, reversed: false };
  var settings = Object.assign({}, DEF, store.get("settings", {}) || {});
  if (!Array.isArray(settings.exams)) settings.exams = [];
  if (["20", "50", "100", "all"].indexOf(String(settings.count)) < 0) settings.count = "all";
  if (settings.mode !== "practice" && settings.mode !== "exam") settings.mode = "practice";
  if (settings.preset !== "custom" && !validPresets[settings.preset]) settings.preset = DEFAULT_PRESET;
  settings.reversed = !!settings.reversed;
  var theme = store.get("theme", "light") === "dark" ? "dark" : "light";
  var wrongOnly = false, drawerOpen = false, pending = false, S = null, timerId = null;

  function applyTheme() {
    document.documentElement.setAttribute("data-theme", theme);
    var tb = $("#themeBtn");
    if (tb) tb.textContent = theme === "dark" ? "☀" : "🌙";
  }
  function saveSettings() { store.set("settings", settings); }
  function saveWrong() { store.set("wrong", Array.from(wrong)); }
  function shuffleArr(a) {
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  function sameSet(a, b) { return a.length === b.length && a.every(function (x) { return b.indexOf(x) >= 0; }); }
  function fmt(ms) { var s = Math.floor(ms / 1000), m = Math.floor(s / 60); s = s % 60; return (m < 10 ? "0" : "") + m + ":" + (s < 10 ? "0" : "") + s; }

  function pool(pidOverride) {
    var pid = pidOverride || settings.preset;
    if (pid && pid !== "custom") {
      var list = BANK.filter(function (q) { return matchPreset(q, pid); });
      if (pid !== "all") {
        list.sort(function (a, b) { return (b.src.length - a.src.length) || (a.id - b.id); });
      }
      return list;
    }
    return BANK.filter(function (q) {

  /* Fixed original option order [0, 1, ..., n-1] */
  function makeOrder(q) {
    return q.o.map(function (_, i) { return i; });
  }

  function newSession(list, doShuffle) {
    var qs = list ? list.slice() : pool();
    if (!list) {
      if (doShuffle) shuffleArr(qs);
      if (settings.count !== "all") qs = qs.slice(0, parseInt(settings.count, 10));
      if (!doShuffle && settings.reversed) qs.reverse();
    }
    S = {
      mode: settings.mode,
      cur: 0,
      submitted: false,
      finished: false,
      confirm: false,
      confirmRestart: false,
      t0: Date.now(),
      t1: null,
      items: qs.map(function (q) { return { q: q, order: makeOrder(q), sel: [], checked: false, ok: null }; })
    };
    pending = false;
    render();
    startTimer();
  }

  function hasProgress() {
    return S && !S.finished && !S.submitted && S.items.some(function (it) { return it.sel.length > 0; });
  }
  function applySettings() {
    saveSettings();
    if (hasProgress()) { pending = true; render(); }
    else newSession(null, false);
  }
  function startTimer() {
    clearInterval(timerId);
    timerId = setInterval(function () {
      var el = $("#timer");
      if (el && S && !S.submitted) el.textContent = fmt(Date.now() - S.t0);
    }, 1000);
  }

  function record(it) { if (it.ok) wrong.delete(it.q.id); else wrong.add(it.q.id); saveWrong(); }
  function choose(oi) {
    var it = S.items[S.cur];
    if (S.submitted || (S.mode === "practice" && it.checked)) return;
    if (it.q.a.length > 1) {
      var k = it.sel.indexOf(oi);
      if (k >= 0) it.sel.splice(k, 1); else it.sel.push(oi);
    } else {
      it.sel = [oi];
      if (S.mode === "practice") { check(); return; }
    }
    S.confirm = false;
    S.confirmRestart = false;
    render();
  }
  function check() {
    var it = S.items[S.cur];
    if (!it.sel.length || it.checked) return;
    it.checked = true;
    it.ok = sameSet(it.sel, it.q.a);
    record(it);
    render();
  }
  function finish() {
    if (S.mode === "exam") {
      var blank = S.items.filter(function (it) { return !it.sel.length; }).length;
      if (blank && !S.confirm) { S.confirm = true; render(); return; }
      S.items.forEach(function (it) { it.checked = true; it.ok = it.sel.length > 0 && sameSet(it.sel, it.q.a); record(it); });
    }
    S.submitted = true;
    S.finished = true;
    S.t1 = Date.now();
    render();
    scrollMain();
  }
  function restart() {
    var ansCount = S.items.filter(function (it) { return it.sel.length > 0; }).length;
    if (S.mode === "exam" && !S.submitted && ansCount >= 5 && !S.confirmRestart) {
      S.confirmRestart = true;
      render();
      return;
    }
    newSession(S.items.map(function (it) { return it.q; }), false);
    scrollMain();
  }
  function go(i) {
    if (i < 0 || i >= S.items.length) return;
    S.cur = i;
    S.finished = false;
    S.confirmRestart = false;
    render();
    scrollMain();
  }
  function scrollMain() {
    var m = $("#main");
    if (!m) return;
    if (m.getBoundingClientRect().top < 0) {
      var smooth = !window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      m.scrollIntoView({ behavior: smooth ? "smooth" : "auto", block: "start" });
    }
  }


  var figN = 0;
  function parseTree(s) {
    var i = 0;
    function node() {
      var v = "";
      while (i < s.length && "(),".indexOf(s[i]) < 0) v += s[i++];
      v = v.trim();
      if (!v) return null;
      var n = { v: v, l: null, r: null };
      if (s[i] === "(") { i++; n.l = node(); if (s[i] === ",") i++; n.r = node(); if (s[i] === ")") i++; }
      return n;
    }
    return node();
  }
  function treeSVG(t, huff) {
    var root = parseTree(t), k = 0, maxD = 0, nodes = [];
    (function walk(n, d) { if (!n) return; walk(n.l, d + 1); n.x = k++; n.d = d; maxD = Math.max(maxD, d); nodes.push(n); walk(n.r, d + 1); })(root, 0);
    var dx = 44, dy = 54, W = k * dx + 16, H = (maxD + 1) * dy + 6;
    var X = function (n) { return 8 + dx / 2 + n.x * dx; }, Y = function (n) { return 24 + n.d * dy; };
    var e = "", lab = "", c = "";
    nodes.forEach(function (n) {
      [[n.l, "0"], [n.r, "1"]].forEach(function (p) {
        var ch = p[0]; if (!ch) return;
        e += '<line class="e" x1="' + X(n) + '" y1="' + Y(n) + '" x2="' + X(ch) + '" y2="' + Y(ch) + '"/>';
        if (huff) lab += '<text class="w" x="' + ((X(n) + X(ch)) / 2 + (p[1] === "0" ? -9 : 9)) + '" y="' + ((Y(n) + Y(ch)) / 2 - 4) + '">' + p[1] + '</text>';
      });
      if (huff && n.v === "*") c += '<circle class="n ni" cx="' + X(n) + '" cy="' + Y(n) + '" r="9"/>';
      else c += '<ellipse class="n" cx="' + X(n) + '" cy="' + Y(n) + '" rx="' + Math.max(16, 5 + n.v.length * 5) + '" ry="13"/><text x="' + X(n) + '" y="' + Y(n) + '">' + esc(n.v) + '</text>';
    });
    return '<svg viewBox="0 0 ' + W + ' ' + H + '" width="' + W + '" role="img" aria-label="' + (huff ? "Cây Huffman" : "Cây nhị phân") + ': ' + esc(t) + '">' + e + lab + c + '</svg>';
  }
  function graphSVG(f) {
    var id = "ah" + (++figN), W = 420, H = 250;
    var P = {}; Object.keys(f.nodes).forEach(function (n) { P[n] = [30 + f.nodes[n][0] / 100 * (W - 60), 22 + f.nodes[n][1] / 100 * (H - 44)]; });
    var toks = f.edges.split(/\s+/).filter(Boolean).map(function (tk) {
      var w = tk.split(":"), dir = w[0].indexOf(">") >= 0, ab = w[0].split(/[->]/);
      return { a: ab[0], b: ab[1], w: w[1], dir: dir };
    });
    var cnt = {}, seen = {};
    toks.forEach(function (t) { var key = [t.a, t.b].sort().join("|"); cnt[key] = (cnt[key] || 0) + 1; });
    var e = "", lab = "", c = "";
    toks.forEach(function (t) {
      var key = [t.a, t.b].sort().join("|"), m = cnt[key], k = seen[key] = (seen[key] || 0) + 1;
      var p = P[t.a], q = P[t.b], dxv = q[0] - p[0], dyv = q[1] - p[1], len = Math.sqrt(dxv * dxv + dyv * dyv) || 1;
      var nx = -dyv / len, ny = dxv / len, off = m > 1 ? (k - 1 - (m - 1) / 2) * 30 : 0;
      var sx = t.a < t.b ? 1 : -1; nx *= sx; ny *= sx;
      var x2 = q[0], y2 = q[1];
      if (t.dir) { x2 = q[0] - dxv / len * 17; y2 = q[1] - dyv / len * 14; }
      var mx = (p[0] + q[0]) / 2 + nx * off, my = (p[1] + q[1]) / 2 + ny * off;
      var mk = t.dir ? ' marker-end="url(#' + id + ')"' : "";
      if (off) e += '<path class="e" d="M' + p[0] + ' ' + p[1] + ' Q' + (mx * 2 - (p[0] + q[0]) / 2) + ' ' + (my * 2 - (p[1] + q[1]) / 2) + ' ' + x2 + ' ' + y2 + '"' + mk + '/>';
      else e += '<line class="e" x1="' + p[0] + '" y1="' + p[1] + '" x2="' + x2 + '" y2="' + y2 + '"' + mk + '/>';
      if (t.w) lab += '<text class="w" x="' + (mx + nx * 10) + '" y="' + (my + ny * 10) + '">' + esc(t.w) + '</text>';
    });
    Object.keys(P).forEach(function (n) { c += '<ellipse class="n" cx="' + P[n][0] + '" cy="' + P[n][1] + '" rx="16" ry="13"/><text x="' + P[n][0] + '" y="' + P[n][1] + '">' + esc(n) + '</text>'; });
    var defs = '<defs><marker id="' + id + '" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0 0 L10 5 L0 10 z"/></marker></defs>';
    return '<svg viewBox="0 0 ' + W + ' ' + H + '" width="' + W + '" role="img" aria-label="Đồ thị ' + (f.dir ? "có hướng" : "vô hướng") + ', cạnh: ' + esc(f.edges) + '">' + defs + e + lab + c + '</svg>';
  }
  function figSVG(f) {
    if (f.type === "tree") return treeSVG(f.t, false);

  function initPresetsAndFilters() {
    $("#presetsBar").innerHTML = PRESETS.map(function (p) {
      var cnt = pool(p.id).length;
      return '<button type="button" class="preset-btn" data-preset="' + p.id + '" title="' + esc(p.hint) + '">' + esc(p.label) + '<span class="count">' + cnt + '</span></button>';
    }).join("");

    $("#chips").innerHTML = '<button type="button" class="chip" data-exam="">Tất cả (' + BANK.length + ')</button>' + EXAMS.map(function (e) {
      var n = BANK.filter(function (q) { return q.src.indexOf(e) >= 0; }).length;
      return '<button type="button" class="chip" data-exam="' + e + '">' + e + '<small>' + n + '</small></button>';
    }).join("");

  function syncControls() {
    document.querySelectorAll("[data-mode]").forEach(function (b) {
      b.setAttribute("aria-pressed", String(b.dataset.mode === settings.mode));
    });
    document.querySelectorAll("[data-preset]").forEach(function (b) {
      b.setAttribute("aria-pressed", String(!wrongOnly && b.dataset.preset === settings.preset));
    });
    $("#count").value = settings.count;
    $("#repeatOnly").checked = !!settings.repeatOnly;
    document.querySelectorAll("[data-exam]").forEach(function (b) {
      var e = b.dataset.exam;
      var active = settings.preset === "custom" && (e ? settings.exams.indexOf(e) >= 0 : settings.exams.length === 0);
      b.setAttribute("aria-pressed", String(active));
    });
    $("#wrongCount").textContent = wrong.size;
    var wb = $("#wrongBtn");
    wb.setAttribute("aria-pressed", String(wrongOnly));
    wb.disabled = wrong.size === 0 && !wrongOnly;
    $("#clearWrongBtn").disabled = wrong.size === 0;

    var parts = [];
    if (wrongOnly) parts.push("Đã sai");
    else if (settings.preset !== "custom") {
      var pObj = PRESETS.filter(function (x) { return x.id === settings.preset; })[0];
      if (pObj) parts.push(pObj.label.replace(/^[^A-Za-zÀ-ỹ]+/, "").trim());
    }
    if (settings.preset === "custom") {
      if (settings.repeatOnly) parts.push("Lặp");
      if (settings.exams.length) parts.push(settings.exams.length + " đề");
    }
    parts.push(settings.count === "all" ? (pool().length + " câu") : (settings.count + " câu"));
    $("#filterSummary").textContent = parts.join(" · ");

    var ft = $("#filterToggle");
    ft.setAttribute("aria-expanded", String(drawerOpen));
    ft.classList.toggle("active", drawerOpen || settings.preset === "custom" || settings.count !== "all" || wrongOnly);
    $("#filterDrawer").hidden = !drawerOpen;
    $("#pending").hidden = !pending;

    var trb = $("#topRestartBtn");
    if (trb) {
      var needConfirm = S && S.confirmRestart;
      trb.textContent = needConfirm ? "Xác nhận làm lại?" : "↺ Làm lại từ đầu";
      trb.classList.toggle("warn", !!needConfirm);

    }

    if (rb) {

  function render() {
    syncControls();

    else main.innerHTML = cardHTML();
    $("#panel").innerHTML = S.items.length ? panelHTML() : "";
  }

  function emptyHTML() {
    var msg = wrongOnly
      ? "Chưa có câu sai nào khớp bộ lọc. Làm thêm câu mới hoặc tắt bộ lọc 'Chỉ câu đã sai'."
      : "Không có câu nào khớp bộ lọc hiện tại.";
    return '<article class="card empty"><p class="qnum">Chưa có câu hỏi</p><p>' + msg + '</p><button type="button" class="btn primary" data-act="resetFilters">↺ Về bộ chọn lọc mặc định</button></article>';
  }

  function lettersOf(it, arr) {

  function cardHTML() {

    var h = '<article class="card"><div class="progress-track"><div class="progress-fill" style="width:' + pct + '%"></div></div>';
    h += '<div class="card-head"><span class="qnum">Câu ' + (S.cur + 1) + '<span class="of"> / ' + S.items.length + '</span></span><div class="badges">';

    h += '</div></div>';

  function resultsHTML() {

  document.addEventListener("click", function (e) {
    var t = e.target.closest("button");

    if (t.dataset.preset != null) {
      settings.preset = t.dataset.preset;
      settings.exams = [];
      settings.repeatOnly = false;
      settings.count = "all";
      wrongOnly = false;
      saveSettings();
      newSession(null, false);
      return;
    }
    if (t.id === "wrongBtn") {
      wrongOnly = !wrongOnly;
      settings.preset = wrongOnly ? "custom" : DEFAULT_PRESET;
      applySettings();
      return;
    }
    if (t.id === "clearWrongBtn") {
      wrong.clear();
      saveWrong();
      if (wrongOnly) { wrongOnly = false; settings.preset = DEFAULT_PRESET; }
      applySettings();
      return;
    }
    if (t.dataset.opt != null) { if (t.getAttribute("aria-disabled") !== "true") choose(parseInt(t.dataset.opt, 10)); return; }
    if (t.dataset.goto != null) { go(parseInt(t.dataset.goto, 10)); return; }
    if (t.dataset.mode) { if (settings.mode !== t.dataset.mode) { settings.mode = t.dataset.mode; applySettings(); } return; }
    if (t.dataset.exam != null) {
      var ex = t.dataset.exam;
      settings.preset = "custom";
      if (!ex) settings.exams = [];
      else {
        var k = settings.exams.indexOf(ex);
        if (k >= 0) settings.exams.splice(k, 1); else settings.exams.push(ex);
        if (settings.exams.length === EXAMS.length) settings.exams = [];
      }
      applySettings();
      return;
    }
    switch (t.dataset.act) {
      case "prev": go(S.cur - 1); break;
      case "next": go(S.cur + 1); break;
      case "check": check(); break;
      case "finish": finish(); break;
      case "results": S.finished = true; render(); scrollMain(); break;
      case "applyFilter": newSession(null, false); break;
      case "shuffleNew":
        settings.reversed = false;
        saveSettings();
        newSession(null, true);
        scrollMain();
        break;
      case "reverse":
        settings.reversed = !settings.reversed;
        saveSettings();
        if (pending) newSession(null, false);
        else newSession(S.items.map(function (it) { return it.q; }).reverse(), false);
        scrollMain();
        break;
      case "restart": restart(); break;
      case "retry": newSession(S.items.filter(function (it) { return it.checked && !it.ok; }).map(function (it) { return it.q; }), false); scrollMain(); break;
      case "resetFilters":
        settings.preset = DEFAULT_PRESET;
        settings.exams = [];
        settings.repeatOnly = false;
        settings.count = "all";
        settings.reversed = false;
        wrongOnly = false;
        saveSettings();
        newSession(null, false);
        break;
    }
  });

  $("#count").addEventListener("change", function (e) { settings.count = e.target.value; applySettings(); });
  $("#repeatOnly").addEventListener("change", function (e) {
    settings.repeatOnly = e.target.checked;
    settings.preset = "custom";
    applySettings();
  });
  document.addEventListener("keydown", function (e) {
    if (!S || !S.items.length || S.finished) return;
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    var tag = (e.target.tagName || "").toLowerCase();
    if (tag === "select" || tag === "input" || tag === "textarea") return;
    var it = S.items[S.cur], key = e.key.toLowerCase();
    var di = "abcdefg".indexOf(key);
    if (di < 0 && /^[1-7]$/.test(key)) di = parseInt(key, 10) - 1;
    if (di >= 0 && di < it.order.length) { e.preventDefault(); choose(it.order[di]); return; }
    if (e.key === "ArrowRight") { e.preventDefault(); go(S.cur + 1); }
    else if (e.key === "ArrowLeft") { e.preventDefault(); go(S.cur - 1); }
    else if (e.key === "Enter" && tag !== "button") {
      e.preventDefault();
      if (S.mode === "practice" && !it.checked && !S.submitted && it.sel.length) check();
      else if (S.cur < S.items.length - 1) go(S.cur + 1);
    }
  });

  applyTheme();
  initPresetsAndFilters();
  newSession(null, false);
})();
</script>
</body>
</html>
