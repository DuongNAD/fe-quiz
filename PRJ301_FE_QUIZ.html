<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PRJ301 FE Quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
:root {
  --bg: #F8FAFC;
  --surface: #FFFFFF;
  --surface-2: #F1F5F9;
  --ink: #0F172A;
  --muted: #64748B;
  --line: #E2E8F0;
  --accent: #C2410C;
  --accent-ink: #FFFFFF;
  --accent-soft: #FFEDD5;
  --ok: #15803D;
  --ok-soft: #DCFCE7;
  --bad: #DC2626;
  --bad-soft: #FEE2E2;
  --warn: #B45309;
  --warn-soft: #FEF3C7;
  --font-body: "Be Vietnam Pro", "Segoe UI", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", Consolas, ui-monospace, monospace;
  --radius: 12px;
  --shadow: 0 1px 3px rgba(15, 23, 42, .04), 0 4px 12px rgba(15, 23, 42, .03);
}
:root[data-theme="dark"] {
  --bg: #0B1120;
  --surface: #111827;
  --surface-2: #1E293B;
  --ink: #F1F5F9;
  --muted: #94A3B8;
  --line: #273449;
  --accent: #FB923C;
  --accent-ink: #0B1120;
  --accent-soft: #431407;
  --ok: #4ADE80;
  --ok-soft: #143624;
  --bad: #F87171;
  --bad-soft: #3D1A1D;
  --warn: #FBBF24;
  --warn-soft: #3A2A12;
  --shadow: none;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 14.5px;
  line-height: 1.48;
  padding: 0 12px 32px;
}
.wrap { max-width: 1120px; margin-inline: auto; }
button, select { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: not-allowed; opacity: .45; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* compact single-row top bar */
.topbar {
  margin-top: 8px;
  padding: 7px 10px;
  min-height: 44px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 6px 10px;
}
.brand { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; }
.subj-pill {
  font-family: var(--font-mono);
  font-size: 11.5px;
  font-weight: 600;
  letter-spacing: .04em;
  padding: 3px 8px;
  border-radius: 6px;
  background: var(--accent-soft);
  color: var(--accent);
}
.brand h1 {
  margin: 0;
  font-size: 16px;
  font-weight: 700;
  letter-spacing: -.01em;
}
.switch-link {
  font-size: 12.5px;
  font-weight: 600;
  color: var(--accent);
  text-decoration: none;
  padding: 3px 8px;
  border-radius: 6px;
  border: 1px solid transparent;
}
.switch-link:hover { background: var(--accent-soft); }

.top-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.seg {
  display: inline-flex;
  padding: 2px;
  border-radius: 8px;
  border: 1px solid var(--line);
  background: var(--surface-2);
}
.seg button {
  border: 0;
  background: transparent;
  padding: 4px 10px;
  border-radius: 6px;
  font-size: 13px;
  font-weight: 600;
  color: var(--muted);
}
.seg button[aria-pressed="true"] {
  background: var(--surface);
  color: var(--ink);
  box-shadow: 0 1px 2px rgba(15, 23, 42, .08);
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  padding: 6px 11px;
  border-radius: 8px;
  font-size: 13px;
  font-weight: 600;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--ink);
  white-space: nowrap;
}
.btn:hover:not(:disabled) { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover:not(:disabled) { filter: brightness(0.95); }
.btn.warn { background: var(--warn-soft); border-color: var(--warn); color: var(--warn); }
.btn.sm { padding: 4px 9px; font-size: 12px; }
.btn.wide { width: 100%; }
.btn .count {
  font-family: var(--font-mono);
  font-size: 11px;
  padding: 1px 6px;
  border-radius: 999px;
  background: var(--surface-2);
  color: var(--ink);
}
.btn.active { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.btn.warn-toggle[aria-pressed="true"] { background: var(--warn-soft); border-color: var(--warn); color: var(--warn); }
.icon-btn { width: 32px; padding: 6px 0; }

/* high-ROI preset strip */
.presets {
  margin-top: 6px;
  padding: 6px 10px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 5px 6px;
}
.preset-btn {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 4px 10px;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: var(--surface-2);
  color: var(--ink);
  font-size: 12.5px;
  font-weight: 600;
  white-space: nowrap;
}
.preset-btn:hover { border-color: var(--accent); }
.preset-btn .count {
  font-family: var(--font-mono);
  font-size: 11px;
  padding: 1px 6px;
  border-radius: 999px;
  background: var(--surface);
  color: var(--muted);
}
.preset-btn[aria-pressed="true"] {
  background: var(--accent);
  border-color: var(--accent);
  color: var(--accent-ink);
}
.preset-btn[aria-pressed="true"] .count {
  background: rgba(255, 255, 255, .22);
  color: var(--accent-ink);
}

/* 20-question chunk strip */
.chunks {
  margin-top: 6px;
  padding: 5px 10px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 5px;
}
.chunks[hidden] { display: none; }
.chunk-lbl {
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 600;
  color: var(--muted);
  white-space: nowrap;
  margin-right: 2px;
}
.chunk-btn {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 3px 9px;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: var(--surface-2);
  color: var(--ink);
  font-family: var(--font-mono);
  font-size: 12px;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.chunk-btn:hover { border-color: var(--accent); }
.chunk-btn[aria-pressed="true"] {
  background: var(--accent-soft);
  border-color: var(--accent);
  color: var(--accent);
}
.chunk-btn.chunk-all {
  font-family: var(--font-body);
  font-size: 12px;
}

/* collapsible filter drawer */
.drawer {
  margin-top: 8px;
  padding: 10px 12px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  display: grid;
  gap: 10px;
}
.drawer[hidden] { display: none; }
.drow { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.field { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
select {
  background: var(--surface-2);
  border: 1px solid var(--line);
  border-radius: 7px;
  padding: 4px 8px;
  font-size: 13px;
  font-weight: 500;
}
.check { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; cursor: pointer; }
.check input { width: 15px; height: 15px; accent-color: var(--accent); }
.lbl { font-family: var(--font-mono); font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }
.chip {
  font-family: var(--font-mono);
  font-size: 11.5px;
  padding: 3px 9px;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: var(--surface-2);
}
.chip small { color: var(--muted); margin-left: 4px; }
.chip[aria-pressed="true"] {
  background: var(--accent-soft);
  border-color: var(--accent);
  color: var(--accent);
  font-weight: 600;
}
.pending {
  margin-top: 8px;
  padding: 8px 12px;
  border-radius: 9px;
  background: var(--warn-soft);
  border: 1px solid var(--warn);
  color: var(--ink);
  font-size: 13px;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}
.pending[hidden] { display: none; }

/* focused workspace */
.work {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 244px;
  gap: 12px;
  margin-top: 10px;
  align-items: start;
}
@media (max-width: 860px) { .work { grid-template-columns: minmax(0, 1fr); } }

.card {
  position: relative;
  overflow: hidden;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 15px 18px 13px;
  min-width: 0;
}

.progress-track {
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 3px;
  background: var(--surface-2);
}
.progress-fill {
  height: 100%;
  background: var(--accent);
  transition: width .2s ease;
}

.card-head {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 6px;
}
.qnum {
  font-family: var(--font-mono);
  font-size: 15px;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
}
.qnum .of { color: var(--muted); font-weight: 400; font-size: 13px; }
.badges { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }
.badge {
  font-family: var(--font-mono);
  font-size: 11px;
  padding: 2px 7px;
  border-radius: 6px;
  border: 1px solid var(--line);
  background: var(--surface-2);
  color: var(--muted);
}
.badge.multi { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 600; }
.badge.flag { background: var(--warn-soft); border-color: var(--warn); color: var(--warn); font-weight: 600; }

.qtext {
  font-size: 15px;
  font-weight: 500;
  line-height: 1.5;
  margin: 10px 0 12px;
  max-width: 72ch;
}
.code {
  font-family: var(--font-mono);
  font-size: 12.5px;
  line-height: 1.5;
  background: var(--surface-2);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 9px 11px;
  margin: 0 0 12px;
  overflow-x: auto;
}


.opts { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.opt {
  width: 100%;
  display: flex;
  align-items: flex-start;
  gap: 9px;
  text-align: left;
  padding: 8px 11px;
  border-radius: 8px;
  border: 1px solid var(--line);
  background: var(--surface);
  line-height: 1.44;
}
.opt:hover:not([aria-disabled="true"]) { border-color: var(--accent); background: var(--surface-2); }
.opt[aria-disabled="true"] { cursor: default; }
.opt .key {
  flex: none;
  width: 24px;
  height: 24px;
  display: grid;
  place-items: center;
  font-family: var(--font-mono);
  font-size: 12px;
  font-weight: 600;
  border-radius: 6px;
  border: 1px solid var(--line);
  background: var(--surface-2);
}
.opt .txt { flex: 1 1 auto; min-width: 0; padding-top: 1px; overflow-wrap: anywhere; }
.opt .txt.mono { font-family: var(--font-mono); font-size: 12.5px; white-space: pre-wrap; }
.opt .mark { flex: none; font-family: var(--font-mono); font-weight: 700; padding-top: 1px; }
.opt.is-selected { border-color: var(--accent); background: var(--accent-soft); }
.opt.is-selected .key { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.opt.is-correct { border-color: var(--ok); background: var(--ok-soft); }
.opt.is-correct .key { background: var(--ok); border-color: var(--ok); color: #FFFFFF; }
.opt.is-correct .mark, .opt.is-missed .mark { color: var(--ok); }
.opt.is-wrong { border-color: var(--bad); background: var(--bad-soft); }
.opt.is-wrong .key { background: var(--bad); border-color: var(--bad); color: #FFFFFF; }
.opt.is-wrong .mark { color: var(--bad); }
.opt.is-missed { border-style: dashed; border-color: var(--ok); background: var(--ok-soft); }

.feedback {
  margin-top: 10px;
  padding: 8px 12px;
  border-radius: 8px;
  background: var(--surface-2);
  border: 1px solid var(--line);
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}
.verdict { font-family: var(--font-mono); font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; }
.ans-tag { font-weight: 600; font-size: 13.5px; color: var(--ink); }
.feedback.ok .verdict { color: var(--ok); }
.feedback.bad .verdict, .feedback.skip .verdict { color: var(--bad); }

.nav {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin-top: 12px;
  padding-top: 10px;
  border-top: 1px solid var(--line);
}
.nav-l, .nav-r { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }

/* compact sticky sidebar */
.panel {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 11px;
  display: grid;
  gap: 9px;
  position: sticky;
  top: 12px;
}
@media (max-width: 860px) { .panel { position: static; } }
.meter { display: flex; gap: 12px; justify-content: space-between; }
.meter > div { min-width: 0; }
.meter p { margin: 1px 0 0; font-size: 11px; color: var(--muted); }
.big { font-family: var(--font-mono); font-size: 20px; font-weight: 700; line-height: 1.1; font-variant-numeric: tabular-nums; }
.big.ok { color: var(--ok); }
.big.bad { color: var(--bad); }
.unit { font-family: var(--font-mono); font-size: 12.5px; color: var(--muted); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(30px, 1fr)); gap: 4px; }
.pin {
  height: 28px;
  padding: 0;
  border-radius: 5px;
  border: 1px solid var(--line);
  background: var(--surface-2);
  font-family: var(--font-mono);
  font-size: 11.5px;
  font-variant-numeric: tabular-nums;
}
.pin.ans { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 600; }
.pin.ok { background: var(--ok-soft); border-color: var(--ok); color: var(--ok); font-weight: 600; }
.pin.bad { background: var(--bad-soft); border-color: var(--bad); color: var(--bad); font-weight: 600; }
.pin.cur { outline: 2px solid var(--ink); outline-offset: 1px; }
.panel-actions { display: grid; gap: 6px; }

/* results */
.score { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; }
.score .num { font-family: var(--font-mono); font-weight: 700; font-size: 42px; line-height: 1; font-variant-numeric: tabular-nums; }
.score .num small { font-size: 16px; color: var(--muted); font-weight: 500; }
.score p { margin: 2px 0; color: var(--muted); font-size: 13.5px; }
.res-actions { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0 4px; }
.review { list-style: none; margin: 12px 0 0; padding: 0; display: grid; gap: 8px; }
.review li { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; display: grid; gap: 4px; background: var(--surface-2); }
.review .rh { display: flex; justify-content: space-between; align-items: center; gap: 6px; font-family: var(--font-mono); font-size: 11.5px; color: var(--muted); }
.review .rq { margin: 0; font-weight: 600; font-size: 14px; }
.review .ra { margin: 0; font-size: 13px; }
.review .ra.your { color: var(--bad); }
.review .ra.right { color: var(--ok); }
h2 { font-size: 16px; font-weight: 700; margin: 16px 0 0; }
.empty p { color: var(--muted); margin: 8px 0 12px; }
@media (max-width: 600px) {
  body { padding: 0 8px 24px; font-size: 14px; }
  .topbar { margin-top: 6px; padding: 6px 8px; gap: 6px; }
  .brand h1 { font-size: 15px; }
  .btn { padding: 5px 9px; font-size: 12.5px; }
  .seg button { padding: 4px 8px; font-size: 12.5px; }
  .icon-btn { width: 30px; padding: 5px 0; }
  .presets { flex-wrap: nowrap; overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; padding: 5px 8px; }
  .presets::-webkit-scrollbar { display: none; }
  .chunks { flex-wrap: nowrap; overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; padding: 5px 8px; }
  .chunks::-webkit-scrollbar { display: none; }
  .card { padding: 12px 12px 10px; }
  .qtext { font-size: 14.5px; margin: 8px 0 10px; }
  .opt { padding: 8px 10px; gap: 8px; }
  .grid { grid-template-columns: repeat(auto-fill, minmax(28px, 1fr)); }
  .pin { height: 27px; }
}
@media (prefers-reduced-motion: no-preference) { .opt, .pin, .btn, .chip, .preset-btn, .chunk-btn { transition: border-color .15s, background-color .15s; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="topbar">
    <div class="brand">
      <span class="subj-pill">PRJ301</span>
      <h1>PRJ301 FE Quiz</h1>
      <a class="switch-link" href="./index.html" title="Về trang chọn môn FE Quiz">← Chọn môn</a>
    </div>
    <div class="top-actions">
      <div class="seg" role="group" aria-label="Chế độ">
        <button type="button" data-mode="practice" aria-pressed="true">Luyện tập</button>
        <button type="button" data-mode="exam" aria-pressed="false">Thi thử</button>
      </div>
      <button type="button" class="btn" id="filterToggle" aria-expanded="false" aria-controls="filterDrawer">Bộ lọc <span class="count" id="filterSummary">Tất cả</span> ▾</button>
      <button type="button" class="btn" id="topRestartBtn" data-act="restart">↺ Làm lại từ đầu</button>
      <button type="button" class="btn" id="reverseBtn" data-act="reverse" aria-pressed="false" title="Lật ngược thứ tự câu hỏi (câu cuối lên câu 1, giữ nguyên A–D)">⇅ Đảo ngược</button>
      <button type="button" class="btn primary" data-act="shuffleNew" title="Xáo thứ tự câu hỏi trong bộ đang chọn (vẫn giữ nguyên A–D)">Trộn bộ mới</button>
      <button type="button" class="btn icon-btn" id="themeBtn" title="Đổi giao diện Sáng / Tối" aria-label="Đổi giao diện Sáng / Tối">🌙</button>
    </div>
  </header>

  <nav class="presets" id="presetsBar" aria-label="Bộ ôn chọn lọc"></nav>
  <nav class="chunks" id="chunksBar" aria-label="Chia phần 20 câu" hidden></nav>

  <section class="drawer" id="filterDrawer" aria-label="Bộ lọc nâng cao" hidden>
    <div class="drow">
      <label class="field" for="count">Số câu
        <select id="count">
          <option value="20">20</option>
          <option value="50">50</option>
          <option value="100">100</option>
          <option value="all">Tất cả</option>
        </select>
      </label>
      <label class="check" for="repeatOnly"><input type="checkbox" id="repeatOnly"> Chỉ câu lặp ≥ 2 đề (<span id="repCount">0</span>)</label>
      <button type="button" class="btn sm warn-toggle" id="wrongBtn" aria-pressed="false">Chỉ câu đã sai <span class="count" id="wrongCount">0</span></button>
      <button type="button" class="btn sm" id="clearWrongBtn">Xoá lịch sử sai</button>
    </div>
    <div class="drow">
      <span class="lbl">Đề</span>
      <div class="chips" id="chips"></div>
    </div>
  </section>

  <div class="pending" id="pending" hidden>
    <span>Bộ lọc đã thay đổi. Áp dụng ngay để tạo lại danh sách câu hỏi?</span>
    <button type="button" class="btn primary sm" data-act="applyFilter">Áp dụng bộ lọc ngay</button>
  </div>

  <div class="work">
    <main id="main" aria-live="polite"></main>
    <aside id="panel" aria-label="Tiến độ"></aside>
  </div>
</div>

        pw.close();\n    }\n}","public class RecordServlet extends HttpServlet\n{\n  protected void doPost(HttpServletRequest req,HttpServletResponse res)throws ServletException,IOException\n    {\n        PrintWriter pw=res.getWriter();\n        res.setContentType(\"text/html\");\n        String account=req.getParameter(\"txtname2\");\n        String Addr=req.getParameter(\"txtadd2\");\n        pw.println(\"Hello \" + account + \" from\" + Addr);\n        pw.close();\n    }\n}","public class RecordServlet extends HttpServlet\n{\n  protected void doGet(HttpServletRequest req,HttpServletResponse res)throws ServletException,IOException\n    {\n        PrintWriter pw=res.getWriter();\n        res.setContentType(\"text/html\");\n        String account=req.getParameter(\"txtname1\");\n        String Addr=req.getParameter(\"txtadd1\");\n        pw.println(\"Hello \" + account + \" from\" + Addr);\n        pw.close();\n    }\n}","public class RecordServlet extends HttpServlet\n{\n  protected void doGet(HttpServletRequest req,HttpServletResponse res)throws ServletException,IOException\n    {\n        PrintWriter pw=res.getWriter();\n        res.setContentType(\"text/html\");\n        String account=req.getParameter(\"txtname2\");\n        String Addr=req.getParameter(\"txtadd2\");\n        pw.println(\"Hello \" + account + \" from\" + Addr);\n        pw.close();\n    }\n}"],"a":[3],"src":["SP26-RE"],"code":"\u003chtml>\n\u003cbody>\n\u003cform action=\"Record\" >\n  User:\u003cinput type=\"text\" id=\"txtname1\" name=\"txtname2\">\u003cbr>\n  Address:\u003cinput type=\"text\" id=\"txtadd1\" name=\"txtadd2\">\u003cbr>\n  \u003cinput type=\"submit\" value=\"GotoZone\">\n\u003c/form>\n\u003c/body>\n\u003c/html>"},{"id":224,"q":"All JSP pages is translated into_____","o":["JavaBean","Servlet class","Java Class","XML Document"],"a":[1],"src":["SP26-RE"]},{"id":225,"q":"How can you include another JSP file within a JSP page?","o":["Using the \u003cimport> tag.","Using the \u003c% empty string)"],"a":[2],"src":["SP26-RE"],"code":"\u003cjsp:useBean id=\"e1\" class=\"model.Book\" scope=\"page\">\n    \u003cjsp:setProperty name=\"e1\" property=\"id\" value=\"1\"/>\n    \u003cjsp:setProperty name=\"e1\" property=\"name\" value=\"han va yeu\"/>\n    \u003cjsp:setProperty name=\"e1\" property=\"price\" value=\"100\"/>\n\u003c/jsp:useBean>\n\u003cjsp:useBean id=\"e2\" class=\"model.Book\" scope=\"page\">\n    \u003cjsp:setProperty name=\"e2\" property=\"id\" value=\"2\"/>\n    \u003cjsp:setProperty name=\"e2\" property=\"name\" value=\"ngon ngu cua tinh yeu\"/>\n    \u003cjsp:setProperty name=\"e2\" property=\"price\" value=\"120\"/>\n\u003c/jsp:useBean>\n  \u003cc:set var=\"total\" value=\"${e1.price+e2.price}\" />\n  Result= ${total}"},{"id":232,"q":"What does this EL expression mean? ${not empty param.username}","o":["Checks if the username parameter has a value","Returns true if username is empty","Returns the value of username","Always returns username","Checks if the username parameter has a value then return its value"],"a":[0],"src":["SP26-RE"]},{"id":233,"q":"Which descriptor file is used to map the custom tag to its tag handler class?","o":["`web.xml`","`index.html`","`taglib.tld`","`deployment.descriptor`"],"a":[2],"src":["SP26-RE"]},{"id":234,"q":"What is the role of the SimpleTag interface in custom tag development?","o":["It is used to create complex tags with body content.","It simplifies custom tag creation by providing a simple handle to tag processing.","It handles HTTP requests and responses for the tag.","It manages the lifecycle of JSP pages."],"a":[1],"src":["SP26-RE"]},{"id":235,"q":"What is the purpose of the Tag Description in the TLD file in Java Servlet?","o":["To provide metadata about custom tags.","To define the tag handlers for custom tags.","To specify the tag's attributes and their types.","To declare the location of the JSP file that uses the tag."],"a":[0],"src":["SP26-RE"]},{"id":236,"q":"Which class in JSP API supports creating Custom Tag by the simplest inheritance?","o":["TagSupport","SimpleTagSupport","BodyTagSupport","CustomTagSupport"],"a":[1],"src":["SP26-RE"]},{"id":237,"q":"You need to modify the deployment descriptor for a web application installed in MyWebPro directory. Which file would you look for?","o":["MyWebPro.xml MyWebPro","web.xml in MyWebPro","MyWebPro.xml in MyWebPro /WEB-INF","web.xml in MyWebPro /WEB-INF"],"a":[3],"src":["SP26-RE"]},{"id":238,"q":"What is the purpose of the \u003cfilter> element in the web.xml deployment descriptor of a Java web application?","o":["To define the structure of HTML pages.","To handle HTTP requests and responses.","To map a servlet to a URL pattern, specifying the URL at which the servlet will respond.","To configure and define filters that can intercept requests and responses in the web application.","None of the others"],"a":[3],"src":["SP26-RE"]}]</script>
<script>
(function () {
  "use strict";
  var BANK = JSON.parse(document.getElementById("bank").textContent);
  var EXAMS = ["SU26-B5-RE", "SU26-B5-FE", "SU26-RE", "SU26-FE", "SP26-B5FE", "SP26-RE"];
  var PREFIX = "prj301_clean_v1.";
  var LEGACY_PREFIX = "";
  var L = "ABCDEFG";
  var CHUNK_SIZE = 20;
  var $ = function (s) { return document.querySelector(s); };
  var esc = function (s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); };
  var store = {
    get: function (k, d) {
      try {
        var v = localStorage.getItem(PREFIX + k);
        if (v == null && LEGACY_PREFIX && (k === "wrong" || k === "theme")) {
          var leg = localStorage.getItem(LEGACY_PREFIX + k);
          if (leg != null) { localStorage.setItem(PREFIX + k, leg); v = leg; }
        }
        return v == null ? d : JSON.parse(v);
      } catch (e) { return d; }
    },
    set: function (k, v) { try { localStorage.setItem(PREFIX + k, JSON.stringify(v)); } catch (e) { /* ignore storage errors */ } }
  };

  var DEFAULT_PRESET = "rep2";
  var PRESETS = [
    {
        "id": "all",
        "label": "Tất cả",
        "hint": "Toàn bộ 238 câu từ 6 đề PRJ301 đã giải"
    },
    {
        "id": "ex_SU26-B5-RE",
        "label": "📝 SU26-B5-RE",
        "hint": "Trọn bộ 50 câu đề SU26-B5-RE"
    },
    {
        "id": "ex_SU26-B5-FE",
        "label": "📝 SU26-B5-FE",
        "hint": "Trọn bộ 50 câu đề SU26-B5-FE"
    },
    {
        "id": "ex_SU26-RE",
        "label": "📝 SU26-RE",
        "hint": "Trọn bộ 50 câu đề SU26-RE"
    },
    {
        "id": "ex_SU26-FE",
        "label": "📝 SU26-FE",
        "hint": "Trọn bộ 50 câu đề SU26-FE"
    },
    {
        "id": "ex_SP26-B5FE",
        "label": "📝 SP26-B5FE",
        "hint": "Trọn bộ 50 câu đề SP26-B5FE"
    },
    {
        "id": "ex_SP26-RE",
        "label": "📝 SP26-RE",
        "hint": "Trọn bộ 50 câu đề SP26-RE"
    },
    {
        "id": "hot3",
        "label": "★ Siêu tủ ≥ 3 đề",
        "hint": "4 câu siêu tủ lặp từ 3/6 đề trở lên"
    },
    {
        "id": "rep2",
        "label": "🔥 Lặp ≥ 2 đề",
        "hint": "57 câu lặp từ 2/6 đề trở lên"
    }
];
  function matchPreset(q, pid) {
    if (pid === "hot3") return q.src.length >= 3;
    if (pid === "rep2") return q.src.length >= 2;
    if (pid.indexOf("ex_") === 0) return q.src.indexOf(pid.slice(3)) >= 0;
    return true;
  }

  var ids = {};
  BANK.forEach(function (q) { ids[q.id] = true; });
  var validPresets = {};
  PRESETS.forEach(function (p) { validPresets[p.id] = true; });

  var wrong = new Set((store.get("wrong", []) || []).filter(function (id) { return ids[id]; }));
  var DEF = { mode: "practice", count: "all", exams: [], repeatOnly: false, preset: DEFAULT_PRESET, reversed: false, chunk: 0 };
  var settings = Object.assign({}, DEF, store.get("settings", {}) || {});
  if (!Array.isArray(settings.exams)) settings.exams = [];
  if (["20", "50", "100", "all"].indexOf(String(settings.count)) < 0) settings.count = "all";
  if (settings.mode !== "practice" && settings.mode !== "exam") settings.mode = "practice";
  if (settings.preset !== "custom" && !validPresets[settings.preset]) settings.preset = DEFAULT_PRESET;
  settings.reversed = !!settings.reversed;
  if (settings.chunk !== "all") {
    var ci = parseInt(settings.chunk, 10);
    settings.chunk = (isNaN(ci) || ci < 0) ? 0 : ci;
  }
  var theme = store.get("theme", "light") === "dark" ? "dark" : "light";
  var wrongOnly = false, drawerOpen = false, pending = false, S = null, timerId = null, lastChunksLen = -1;

  function applyTheme() {
    document.documentElement.setAttribute("data-theme", theme);
    var tb = $("#themeBtn");
    if (tb) tb.textContent = theme === "dark" ? "☀" : "🌙";
  }
  function saveSettings() { store.set("settings", settings); }
  function saveWrong() { store.set("wrong", Array.from(wrong)); }
  function shuffleArr(a) {
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  function sameSet(a, b) { return a.length === b.length && a.every(function (x) { return b.indexOf(x) >= 0; }); }
  function fmt(ms) { var s = Math.floor(ms / 1000), m = Math.floor(s / 60); s = s % 60; return (m < 10 ? "0" : "") + m + ":" + (s < 10 ? "0" : "") + s; }

  function fmtRange(start, end) {
    return start === end ? String(start) : (start + "–" + end);
  }
  function chunkMetaFor(total, chunkVal) {
    var num = Math.ceil(total / CHUNK_SIZE);
    if (num <= 1 || chunkVal === "all") return null;
    var idx = typeof chunkVal === "number" ? chunkVal : parseInt(chunkVal, 10);
    if (isNaN(idx) || idx < 0 || idx >= num) idx = 0;
    var start = idx * CHUNK_SIZE + 1;
    var end = Math.min((idx + 1) * CHUNK_SIZE, total);
    var hasNext = idx + 1 < num;
    return {
      idx: idx,
      num: num,
      total: total,
      start: start,
      end: end,
      label: fmtRange(start, end),
      nextIdx: hasNext ? idx + 1 : null,
      nextLabel: hasNext ? fmtRange((idx + 1) * CHUNK_SIZE + 1, Math.min((idx + 2) * CHUNK_SIZE, total)) : null
    };
  }

  function pool(pidOverride) {
    var pid = pidOverride || settings.preset;
    if (pid && pid !== "custom") {
      var list = BANK.filter(function (q) { return matchPreset(q, pid); });
      if (pid !== "all") {
        list.sort(function (a, b) { return (b.src.length - a.src.length) || (a.id - b.id); });
      }
      return list;
    }
    return BANK.filter(function (q) {
      if (settings.exams.length && !q.src.some(function (s) { return settings.exams.indexOf(s) >= 0; })) return false;
      if (settings.repeatOnly && q.src.length < 2) return false;
      if (wrongOnly && !wrong.has(q.id)) return false;
      return true;
    });
  }

  /* Fixed original option order [0, 1, ..., n-1] */
  function makeOrder(q) {
    return q.o.map(function (_, i) { return i; });
  }

  function newSession(list, doShuffle, opts) {
    var qs = list ? list.slice() : pool();
    var meta = (opts && opts.chunkMeta !== undefined) ? opts.chunkMeta : null;
    var isRetry = !!(opts && opts.isRetry);
    if (!list) {
      meta = (settings.count === "all") ? chunkMetaFor(qs.length, settings.chunk) : null;
      if (meta) {
        if (settings.chunk !== meta.idx) {
          settings.chunk = meta.idx;
          saveSettings();
        }
        qs = qs.slice(meta.start - 1, meta.end);
        if (doShuffle) shuffleArr(qs);
        else if (settings.reversed) qs.reverse();
      } else {
        if (doShuffle) shuffleArr(qs);
        if (settings.count !== "all") qs = qs.slice(0, parseInt(settings.count, 10));
        if (!doShuffle && settings.reversed) qs.reverse();
      }
    }
    S = {
      mode: settings.mode,
      cur: 0,
      submitted: false,
      finished: false,
      confirm: false,
      confirmRestart: false,
      t0: Date.now(),
      t1: null,
      chunkMeta: meta,
      isRetry: isRetry,
      items: qs.map(function (q) { return { q: q, order: makeOrder(q), sel: [], checked: false, ok: null }; })
    };
    pending = false;
    render();
    startTimer();
  }

  function hasProgress() {
    return S && !S.finished && !S.submitted && S.items.some(function (it) { return it.sel.length > 0; });
  }
  function applySettings() {
    saveSettings();
    if (hasProgress()) { pending = true; render(); }
    else newSession(null, false);
  }
  function startTimer() {
    clearInterval(timerId);
    timerId = setInterval(function () {
      var el = $("#timer");
      if (el && S && !S.submitted) el.textContent = fmt(Date.now() - S.t0);
    }, 1000);
  }

  function record(it) { if (it.ok) wrong.delete(it.q.id); else wrong.add(it.q.id); saveWrong(); }
  function choose(oi) {
    var it = S.items[S.cur];
    if (S.submitted || (S.mode === "practice" && it.checked)) return;
    if (it.q.a.length > 1) {
      var k = it.sel.indexOf(oi);
      if (k >= 0) it.sel.splice(k, 1); else it.sel.push(oi);
    } else {
      it.sel = [oi];
      if (S.mode === "practice") { check(); return; }
    }
    S.confirm = false;
    S.confirmRestart = false;
    render();
  }
  function check() {
    var it = S.items[S.cur];
    if (!it.sel.length || it.checked) return;
    it.checked = true;
    it.ok = sameSet(it.sel, it.q.a);
    record(it);
    render();
  }
  function finish() {
    if (S.mode === "exam") {
      var blank = S.items.filter(function (it) { return !it.sel.length; }).length;
      if (blank && !S.confirm) { S.confirm = true; render(); return; }
      S.items.forEach(function (it) { it.checked = true; it.ok = it.sel.length > 0 && sameSet(it.sel, it.q.a); record(it); });
    }
    S.submitted = true;
    S.finished = true;
    S.t1 = Date.now();
    render();
    scrollMain();
  }
  function restart() {
    var ansCount = S.items.filter(function (it) { return it.sel.length > 0; }).length;
    if (S.mode === "exam" && !S.submitted && ansCount >= 5 && !S.confirmRestart) {
      S.confirmRestart = true;
      render();
      return;
    }
    newSession(S.items.map(function (it) { return it.q; }), false, { chunkMeta: S.chunkMeta, isRetry: S.isRetry });
    scrollMain();
  }
  function go(i) {
    if (i < 0 || i >= S.items.length) return;
    S.cur = i;
    S.finished = false;
    S.confirmRestart = false;
    render();
    scrollMain();
  }
  function scrollMain() {
    var m = $("#main");
    if (!m) return;
    if (m.getBoundingClientRect().top < 0) {
      var smooth = !window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      m.scrollIntoView({ behavior: smooth ? "smooth" : "auto", block: "start" });
    }
  }


  function initPresetsAndFilters() {
    $("#presetsBar").innerHTML = PRESETS.map(function (p) {
      var cnt = pool(p.id).length;
      return '<button type="button" class="preset-btn" data-preset="' + p.id + '" title="' + esc(p.hint) + '">' + esc(p.label) + '<span class="count">' + cnt + '</span></button>';
    }).join("");
    $("#repCount").textContent = BANK.filter(function (q) { return q.src.length >= 2; }).length;
    $("#chips").innerHTML = '<button type="button" class="chip" data-exam="">Tất cả (' + BANK.length + ')</button>' + EXAMS.map(function (e) {
      var n = BANK.filter(function (q) { return q.src.indexOf(e) >= 0; }).length;
      return '<button type="button" class="chip" data-exam="' + e + '">' + e + '<small>' + n + '</small></button>';
    }).join("");
  }

  function syncControls() {
    document.querySelectorAll("[data-mode]").forEach(function (b) {
      b.setAttribute("aria-pressed", String(b.dataset.mode === settings.mode));
    });
    document.querySelectorAll("[data-preset]").forEach(function (b) {
      b.setAttribute("aria-pressed", String(!wrongOnly && b.dataset.preset === settings.preset));
    });
    $("#count").value = settings.count;
    $("#repeatOnly").checked = !!settings.repeatOnly;
    document.querySelectorAll("[data-exam]").forEach(function (b) {
      var e = b.dataset.exam;
      var active = settings.preset === "custom" && (e ? settings.exams.indexOf(e) >= 0 : settings.exams.length === 0);
      b.setAttribute("aria-pressed", String(active));
    });
    $("#wrongCount").textContent = wrong.size;
    var wb = $("#wrongBtn");
    wb.setAttribute("aria-pressed", String(wrongOnly));
    wb.disabled = wrong.size === 0 && !wrongOnly;
    $("#clearWrongBtn").disabled = wrong.size === 0;

    var baseLen = pool().length;
    var numChunks = Math.ceil(baseLen / CHUNK_SIZE);
    var cb = $("#chunksBar");
    if (cb) {
      if (numChunks <= 1) {
        cb.hidden = true;
        if (lastChunksLen !== 0) { cb.innerHTML = ""; lastChunksLen = 0; }
      } else {
        cb.hidden = false;
        if (lastChunksLen !== baseLen) {
          var ch = '<span class="chunk-lbl">Chia 20 câu:</span>';
          for (var ci = 0; ci < numChunks; ci++) {
            var s1 = ci * CHUNK_SIZE + 1;
            var e1 = Math.min((ci + 1) * CHUNK_SIZE, baseLen);
            var rng = fmtRange(s1, e1);
            ch += '<button type="button" class="chunk-btn" data-chunk="' + ci + '" title="Phần ' + (ci + 1) + '/' + numChunks + ' (' + (e1 - s1 + 1) + ' câu)">' + rng + '</button>';
          }
          ch += '<button type="button" class="chunk-btn chunk-all" data-chunk="all" title="Làm liền tất cả ' + baseLen + ' câu không chia">Gộp ' + baseLen + '</button>';
          cb.innerHTML = ch;
          lastChunksLen = baseLen;
        }
        var activeVal = settings.count !== "all" ? null : (settings.chunk === "all" ? "all" : (settings.chunk >= 0 && settings.chunk < numChunks ? settings.chunk : 0));
        cb.querySelectorAll("[data-chunk]").forEach(function (b) {
          b.setAttribute("aria-pressed", String(activeVal !== null && b.dataset.chunk === String(activeVal)));
        });
      }
    }

    var parts = [];
    if (wrongOnly) parts.push("Đã sai");
    else if (settings.preset !== "custom") {
      var pObj = PRESETS.filter(function (x) { return x.id === settings.preset; })[0];
      if (pObj) parts.push(pObj.label.replace(/^[^A-Za-zÀ-ỹ]+/, "").trim());
    }
    if (settings.preset === "custom") {
      if (settings.repeatOnly) parts.push("Lặp");
      if (settings.exams.length) parts.push(settings.exams.length + " đề");
    }
    var activeMeta = settings.count === "all" ? chunkMetaFor(baseLen, settings.chunk) : null;
    if (activeMeta) parts.push(activeMeta.label + "/" + baseLen);
    else parts.push(settings.count === "all" ? (baseLen + " câu") : (settings.count + " câu"));
    $("#filterSummary").textContent = parts.join(" · ");

    var ft = $("#filterToggle");
    ft.setAttribute("aria-expanded", String(drawerOpen));
    ft.classList.toggle("active", drawerOpen || settings.preset === "custom" || settings.count !== "all" || wrongOnly);
    $("#filterDrawer").hidden = !drawerOpen;
    $("#pending").hidden = !pending;

    var trb = $("#topRestartBtn");
    if (trb) {
      var needConfirm = S && S.confirmRestart;
      trb.textContent = needConfirm ? "Xác nhận làm lại?" : "↺ Làm lại từ đầu";
      trb.classList.toggle("warn", !!needConfirm);
      trb.disabled = !S || !S.items.length;
    }
    var rb = $("#reverseBtn");
    if (rb) {
      rb.setAttribute("aria-pressed", String(!!settings.reversed));
      rb.classList.toggle("active", !!settings.reversed);
      rb.disabled = !S || !S.items.length;
    }
  }

  function render() {
    syncControls();
    var main = $("#main");
    if (!S.items.length) main.innerHTML = emptyHTML();
    else if (S.finished) main.innerHTML = resultsHTML();
    else main.innerHTML = cardHTML();
    $("#panel").innerHTML = S.items.length ? panelHTML() : "";
  }

  function emptyHTML() {
    var msg = wrongOnly
      ? "Chưa có câu sai nào khớp bộ lọc. Làm thêm câu mới hoặc tắt bộ lọc 'Chỉ câu đã sai'."
      : "Không có câu nào khớp bộ lọc hiện tại.";
    return '<article class="card empty"><p class="qnum">Chưa có câu hỏi</p><p>' + msg + '</p><button type="button" class="btn primary" data-act="resetFilters">↺ Về bộ chọn lọc mặc định</button></article>';
  }

  function lettersOf(it, arr) {
    return arr.map(function (oi) { return L[it.order.indexOf(oi)]; }).sort().join(", ");
  }

  function cardHTML() {
    var it = S.items[S.cur], q = it.q, multi = q.a.length > 1;
    var reveal = S.submitted || (S.mode === "practice" && it.checked);
    var doneCount = S.items.filter(function (x) { return x.sel.length > 0; }).length;
    var pct = Math.round((doneCount / S.items.length) * 100);
    var h = '<article class="card"><div class="progress-track"><div class="progress-fill" style="width:' + pct + '%"></div></div>';
    h += '<div class="card-head"><span class="qnum">Câu ' + (S.cur + 1) + '<span class="of"> / ' + S.items.length + '</span></span><div class="badges">';
    if (S.chunkMeta) {
      h += '<span class="badge">' + (S.isRetry ? ('Phần ' + (S.chunkMeta.idx + 1) + '/' + S.chunkMeta.num + ' · Ôn sai') : ('Phần ' + (S.chunkMeta.idx + 1) + '/' + S.chunkMeta.num + ' · ' + S.chunkMeta.label)) + '</span>';
    }
    if (multi) h += '<span class="badge multi">Chọn ' + q.a.length + ' đáp án</span>';
    if (q.flag) h += '<span class="badge flag">Tranh cãi</span>';
    h += '<span class="badge" title="' + esc(q.src.join(", ")) + '">' + q.src.length + '/' + EXAMS.length + ' đề</span>';
    h += '</div></div>';
    h += '<p class="qtext">' + esc(q.q) + '</p>';
    if (q.code) h += '<pre class="code"><code>' + esc(q.code) + '</code></pre>';
    
    h += '<ol class="opts" role="' + (multi ? "group" : "radiogroup") + '" aria-label="Các lựa chọn">';
    it.order.forEach(function (oi, di) {
      var chosen = it.sel.indexOf(oi) >= 0, isAns = q.a.indexOf(oi) >= 0, cls = "opt", mark = "";
      if (reveal) {
        if (isAns) { cls += chosen ? " is-correct" : " is-missed"; mark = "✓"; }
        else if (chosen) { cls += " is-wrong"; mark = "✗"; }
      } else if (chosen) cls += " is-selected";
      h += '<li><button type="button" class="' + cls + '" data-opt="' + oi + '" aria-pressed="' + chosen + '"' + (reveal ? ' aria-disabled="true"' : "") + '>' +
        '<span class="key">' + L[di] + '</span><span class="txt' + (q.o[oi].indexOf("\n") >= 0 ? " mono" : "") + '">' + esc(q.o[oi]) + '</span>' + (mark ? '<span class="mark" aria-hidden="true">' + mark + '</span>' : "") + '</button></li>';
    });
    h += '</ol>';
    if (reveal) {
      var v = it.ok ? "ok" : (it.sel.length ? "bad" : "skip");
      var vt = { ok: "Chính xác", bad: "Chưa đúng", skip: "Bỏ trống" }[v];
      h += '<div class="feedback ' + v + '"><span class="verdict">' + vt + '</span><span class="ans-tag">Đáp án: ' + lettersOf(it, q.a) + '</span>' + (q.flag ? '<span class="badge flag">Tranh cãi</span>' : '') + '</div>';
    }
    var last = S.cur === S.items.length - 1;
    var restartLabel = S.confirmRestart ? "Xác nhận làm lại?" : "↺ Làm lại từ đầu";
    h += '<div class="nav"><div class="nav-l"><button type="button" class="btn" data-act="prev"' + (S.cur === 0 ? " disabled" : "") + '>← Câu trước</button>' +
      '<button type="button" class="btn' + (S.confirmRestart ? " warn" : "") + '" data-act="restart">' + restartLabel + '</button></div><div class="nav-r">';
    if (S.mode === "practice" && !it.checked && !S.submitted && multi) {
      h += '<button type="button" class="btn primary" data-act="check"' + (it.sel.length ? "" : " disabled") + '>Kiểm tra</button>';
    }
    var nextPrimary = S.submitted || S.mode === "exam" || it.checked;
    if (!last) h += '<button type="button" class="btn ' + (nextPrimary ? "primary" : "") + '" data-act="next">Câu sau →</button>';
    else if (S.submitted) h += '<button type="button" class="btn primary" data-act="results">Về bảng điểm</button>';
    else h += '<button type="button" class="btn primary" data-act="finish">' + (S.mode === "exam" ? "Nộp bài" : "Xem kết quả") + '</button>';
    h += '</div></div>';
    return h + '</article>';
  }

  function panelHTML() {
    var n = S.items.length;
    var answered = S.items.filter(function (it) { return it.sel.length; }).length;
    var okN = S.items.filter(function (it) { return it.checked && it.ok; }).length;
    var badN = S.items.filter(function (it) { return it.checked && !it.ok; }).length;
    var h = '<div class="panel">';
    if (S.mode === "exam" && !S.submitted) {
      h += '<div class="meter"><div><span class="big">' + answered + '</span><span class="unit">/' + n + '</span><p>đã chọn</p></div><div><span class="big" id="timer">' + fmt(Date.now() - S.t0) + '</span><p>thời gian</p></div></div>';
    } else {
      h += '<div class="meter"><div><span class="big ok">' + okN + '</span><p>đúng</p></div><div><span class="big bad">' + badN + '</span><p>sai</p></div><div><span class="big">' + (n - okN - badN) + '</span><p>' + (S.submitted ? "bỏ qua" : "còn lại") + '</p></div></div>';
    }
    h += '<div class="grid">' + S.items.map(function (it, i) {
      var c = "pin", rev = S.submitted || (S.mode === "practice" && it.checked);
      if (rev && it.checked) c += it.ok ? " ok" : " bad";
      else if (it.sel.length) c += " ans";
      if (i === S.cur && !S.finished) c += " cur";
      return '<button type="button" class="' + c + '" data-goto="' + i + '" aria-label="Câu ' + (i + 1) + '">' + (i + 1) + '</button>';
    }).join("") + '</div>';
    h += '<div class="panel-actions">';
    if (!S.submitted) {
      var label = S.mode === "exam" ? (S.confirm ? "Còn " + (n - answered) + " trống · Bấm để nộp" : "Nộp bài") : "Xem kết quả";
      h += '<button type="button" class="btn ' + (S.mode === "exam" ? "primary" : "") + ' wide" data-act="finish">' + label + '</button>';
    } else if (!S.finished) {
      h += '<button type="button" class="btn primary wide" data-act="results">Về bảng điểm</button>';
    }
    h += '<button type="button" class="btn' + (S.confirmRestart ? " warn" : "") + ' wide" data-act="restart">' + (S.confirmRestart ? "Xác nhận làm lại?" : "↺ Làm lại từ đầu") + '</button>';
    h += '</div></div>';
    return h;
  }

  function resultsHTML() {
    var n = S.items.length;
    var graded = S.items.filter(function (it) { return it.checked; });
    var okN = graded.filter(function (it) { return it.ok; }).length;
    var denom = S.mode === "exam" ? n : Math.max(graded.length, 1);
    var score = Math.round(okN / denom * 100) / 10;
    var misses = S.items.map(function (it, i) { return { it: it, i: i }; }).filter(function (x) { return x.it.checked && !x.it.ok; });
    var time = fmt((S.t1 || Date.now()) - S.t0);
    var h = '<article class="card"><div class="score"><span class="num">' + score.toFixed(1) + '<small> / 10</small></span><div>';
    if (S.mode === "exam") h += '<p><b>' + okN + '/' + n + '</b> câu đúng · ' + (n - okN) + ' câu sai hoặc bỏ trống</p>';
    else h += '<p><b>' + okN + '/' + graded.length + '</b> câu đúng trong số đã làm · ' + (n - graded.length) + ' câu bỏ qua</p>';
    h += '<p>Thời gian ' + time + ' · ' + (S.mode === "exam" ? "Thi thử" : "Luyện tập") + (S.chunkMeta ? (' · Phần ' + (S.chunkMeta.idx + 1) + '/' + S.chunkMeta.num + ' (' + S.chunkMeta.label + ')') : '') + '</p></div></div>';
    h += '<div class="res-actions">';
    if (misses.length) h += '<button type="button" class="btn primary" data-act="retry">Làm lại ' + misses.length + ' câu sai</button>';
    var hasNext = !!(S.chunkMeta && S.chunkMeta.nextIdx != null);
    if (hasNext) h += '<button type="button" class="btn' + (misses.length ? "" : " primary") + '" data-act="nextChunk">Phần tiếp theo (' + S.chunkMeta.nextLabel + ') →</button>';
    h += '<button type="button" class="btn' + (misses.length || hasNext ? "" : " primary") + '" data-act="restart">↺ Làm lại từ đầu</button>' +
      '<button type="button" class="btn" data-goto="0">Xem lại từ câu 1</button>' +
      '<button type="button" class="btn" data-act="shuffleNew">Trộn bộ mới</button></div>';
    if (misses.length) {
      h += '<h2>Câu cần xem lại</h2><ol class="review">';
      misses.forEach(function (x) {
        var it = x.it, q = it.q;
        var yours = it.sel.length ? it.sel.map(function (oi) { return L[it.order.indexOf(oi)] + ". " + esc(q.o[oi]); }).join(" · ") : "Bỏ trống";
        var right = q.a.map(function (oi) { return L[it.order.indexOf(oi)] + ". " + esc(q.o[oi]); }).join(" · ");
        h += '<li><div class="rh"><span>Câu ' + (x.i + 1) + (q.flag ? " · tranh cãi" : "") + '</span><button type="button" class="btn sm" data-goto="' + x.i + '">Mở câu</button></div>' +
          '<p class="rq">' + esc(q.q) + '</p><p class="ra your">Bạn chọn: <b>' + yours + '</b></p><p class="ra right">Đáp án: <b>' + right + '</b></p></li>';
      });
      h += '</ol>';
    } else if (okN) {
      h += '<p>Không sai câu nào trong bộ này.</p>';
    }
    return h + '</article>';
  }

  document.addEventListener("click", function (e) {
    var t = e.target.closest("button");
    if (!t || t.disabled) return;
    if (t.id === "filterToggle") { drawerOpen = !drawerOpen; syncControls(); return; }
    if (t.id === "themeBtn") { theme = theme === "dark" ? "light" : "dark"; store.set("theme", theme); applyTheme(); return; }
    if (t.dataset.preset != null) {
      settings.preset = t.dataset.preset;
      settings.exams = [];
      settings.repeatOnly = false;
      settings.count = "all";
      if (settings.chunk !== "all") settings.chunk = 0;
      wrongOnly = false;
      saveSettings();
      newSession(null, false);
      return;
    }
    if (t.dataset.chunk != null) {
      var val = t.dataset.chunk === "all" ? "all" : parseInt(t.dataset.chunk, 10);
      var countWasAll = settings.count === "all";
      if (countWasAll && settings.chunk === val && !pending && !(S && S.isRetry)) return;
      settings.count = "all";
      settings.chunk = val;
      saveSettings();
      newSession(null, false);
      scrollMain();
      return;
    }
    if (t.id === "wrongBtn") {
      wrongOnly = !wrongOnly;
      settings.preset = wrongOnly ? "custom" : DEFAULT_PRESET;
      if (settings.chunk !== "all") settings.chunk = 0;
      applySettings();
      return;
    }
    if (t.id === "clearWrongBtn") {
      wrong.clear();
      saveWrong();
      if (wrongOnly) { wrongOnly = false; settings.preset = DEFAULT_PRESET; }
      if (settings.chunk !== "all") settings.chunk = 0;
      applySettings();
      return;
    }
    if (t.dataset.opt != null) { if (t.getAttribute("aria-disabled") !== "true") choose(parseInt(t.dataset.opt, 10)); return; }
    if (t.dataset.goto != null) { go(parseInt(t.dataset.goto, 10)); return; }
    if (t.dataset.mode) { if (settings.mode !== t.dataset.mode) { settings.mode = t.dataset.mode; applySettings(); } return; }
    if (t.dataset.exam != null) {
      var ex = t.dataset.exam;
      settings.preset = "custom";
      if (!ex) settings.exams = [];
      else {
        var k = settings.exams.indexOf(ex);
        if (k >= 0) settings.exams.splice(k, 1); else settings.exams.push(ex);
        if (settings.exams.length === EXAMS.length) settings.exams = [];
      }
      if (settings.chunk !== "all") settings.chunk = 0;
      applySettings();
      return;
    }
    switch (t.dataset.act) {
      case "prev": go(S.cur - 1); break;
      case "next": go(S.cur + 1); break;
      case "check": check(); break;
      case "finish": finish(); break;
      case "results": S.finished = true; render(); scrollMain(); break;
      case "applyFilter": newSession(null, false); break;
      case "shuffleNew":
        settings.reversed = false;
        saveSettings();
        newSession(null, true);
        scrollMain();
        break;
      case "reverse":
        settings.reversed = !settings.reversed;
        saveSettings();
        if (pending) newSession(null, false);
        else newSession(S.items.map(function (it) { return it.q; }).reverse(), false, { chunkMeta: S.chunkMeta, isRetry: S.isRetry });
        scrollMain();
        break;
      case "restart": restart(); break;
      case "retry": newSession(S.items.filter(function (it) { return it.checked && !it.ok; }).map(function (it) { return it.q; }), false, { chunkMeta: S.chunkMeta, isRetry: true }); scrollMain(); break;
      case "nextChunk":
        if (S && S.chunkMeta && S.chunkMeta.nextIdx != null) {
          settings.chunk = S.chunkMeta.nextIdx;
          settings.count = "all";
          saveSettings();
          newSession(null, false);
          var activeChunkBtn = $("#chunksBar [data-chunk='" + settings.chunk + "']");
          if (activeChunkBtn && activeChunkBtn.scrollIntoView) activeChunkBtn.scrollIntoView({ behavior: "smooth", block: "nearest", inline: "nearest" });
          scrollMain();
        }
        break;
      case "resetFilters":
        settings.preset = DEFAULT_PRESET;
        settings.exams = [];
        settings.repeatOnly = false;
        settings.count = "all";
        settings.reversed = false;
        settings.chunk = 0;
        wrongOnly = false;
        saveSettings();
        newSession(null, false);
        break;
    }
  });

  $("#count").addEventListener("change", function (e) {
    settings.count = e.target.value;
    if (settings.count !== "all") settings.chunk = "all";
    applySettings();
  });
  $("#repeatOnly").addEventListener("change", function (e) {
    settings.repeatOnly = e.target.checked;
    settings.preset = "custom";
    if (settings.chunk !== "all") settings.chunk = 0;
    applySettings();
  });
  document.addEventListener("keydown", function (e) {
    if (!S || !S.items.length || S.finished) return;
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    var tag = (e.target.tagName || "").toLowerCase();
    if (tag === "select" || tag === "input" || tag === "textarea") return;
    var it = S.items[S.cur], key = e.key.toLowerCase();
    var di = "abcdefg".indexOf(key);
    if (di < 0 && /^[1-7]$/.test(key)) di = parseInt(key, 10) - 1;
    if (di >= 0 && di < it.order.length) { e.preventDefault(); choose(it.order[di]); return; }
    if (e.key === "ArrowRight") { e.preventDefault(); go(S.cur + 1); }
    else if (e.key === "ArrowLeft") { e.preventDefault(); go(S.cur - 1); }
    else if (e.key === "Enter" && tag !== "button") {
      e.preventDefault();
      if (S.mode === "practice" && !it.checked && !S.submitted && it.sel.length) check();
      else if (S.cur < S.items.length - 1) go(S.cur + 1);
    }
  });

  applyTheme();
  initPresetsAndFilters();
  newSession(null, false);
})();
</script>
</body>
</html>
